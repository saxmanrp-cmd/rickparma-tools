<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOV → MP4 | Rick Parma Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #13131e;
      --border:   #2a2a3a;
      --cyan:     #00e5ff;
      --cyan-dim: #00b8cc;
      --text:     #f0f0f0;
      --muted:    #888899;
      --danger:   #ff5f5f;
      --success:  #5fff9a;
      --radius:   12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      width: 100%;
      max-width: 540px;
    }
    .wordmark {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    h1 {
      font-size: clamp(26px, 6vw, 38px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--cyan); }
    .tagline {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .card {
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    #dropzone.hover    { border-color: var(--cyan); background: rgba(0,229,255,0.05); }
    #dropzone.has-file { border-color: var(--cyan); border-style: solid; }
    #dropzone input[type="file"] {
      position: absolute; inset: 0; opacity: 0;
      cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon  { font-size: 40px; line-height: 1; margin-bottom: 12px; display: block; }
    .drop-label { font-size: 15px; font-weight: 600; }
    .drop-sub   { font-size: 13px; color: var(--muted); margin-top: 4px; }
    #file-name  {
      margin-top: 10px; font-size: 13px; color: var(--cyan);
      font-weight: 600; word-break: break-all; display: none;
    }

    #status-area { display: none; flex-direction: column; gap: 10px; }
    #status-area.visible { display: flex; }

    #status-msg { font-size: 13px; color: var(--muted); min-height: 18px; }
    #status-msg.error   { color: var(--danger); }
    #status-msg.success { color: var(--success); }

    .progress-track {
      width: 100%; height: 6px;
      background: var(--border); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
      border-radius: 99px; transition: width 0.3s ease;
    }

    .btn {
      width: 100%; padding: 14px 20px;
      border: none; border-radius: var(--radius);
      font-size: 15px; font-weight: 700; letter-spacing: 0.04em;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active   { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-primary { background: var(--cyan); color: #000; }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }

    .btn-download { background: var(--success); color: #000; display: none; }
    .btn-download.visible { display: block; }
    .btn-download:hover:not(:disabled) { opacity: 0.88; }

    .btn-reset {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); font-size: 13px; padding: 10px; display: none;
    }
    .btn-reset.visible { display: block; }
    .btn-reset:hover:not(:disabled) { border-color: var(--muted); color: var(--text); }

    footer {
      margin-top: 32px; font-size: 12px;
      color: var(--muted); text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill { transition: none; }
    }
  </style>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#000000">
</head>
<body>

  <header>
    <p class="wordmark">Rick Parma Tools</p>
    <h1>MOV <span>→</span> MP4</h1>
    <p class="tagline">Converts locally in your browser — your file never leaves your device</p>
  </header>

  <div class="card">

    <div id="dropzone">
      <input type="file" id="file-input" accept=".mov,video/quicktime" />
      <span class="drop-icon">🎬</span>
      <p class="drop-label">Tap to choose a .MOV file</p>
      <p class="drop-sub">or drag and drop here</p>
      <p id="file-name"></p>
    </div>

    <div id="status-area">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p id="status-msg"></p>
    </div>

    <button class="btn btn-primary" id="convert-btn" disabled>Convert to MP4</button>
    <a class="btn btn-download" id="download-btn">⬇ Download MP4</a>
    <button class="btn btn-reset" id="reset-btn">Convert another file</button>

  </div>

  <footer>
    No internet required after page load · Your file never leaves your device
  </footer>

  <script>
    /*
     * How this works:
     * iPhone MOV files already contain H.264 video + AAC audio —
     * the exact same codecs used in MP4. The only difference is the
     * container label (the "ftyp" box at the start of the file).
     * We swap that label from QuickTime ("qt  ") to MP4 ("isom")
     * without touching a single byte of codec data, so nothing
     * can get corrupted.
     */

    let selectedFile = null;
    let outputURL    = null;

    const dropzone     = document.getElementById('dropzone');
    const fileInput    = document.getElementById('file-input');
    const fileNameEl   = document.getElementById('file-name');
    const convertBtn   = document.getElementById('convert-btn');
    const downloadBtn  = document.getElementById('download-btn');
    const resetBtn     = document.getElementById('reset-btn');
    const statusArea   = document.getElementById('status-area');
    const statusMsg    = document.getElementById('status-msg');
    const progressFill = document.getElementById('progress-fill');

    // ── File selection
    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
    dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('hover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('hover'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('hover');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      const name = file.name.toLowerCase();
      if (!name.endsWith('.mov') && file.type !== 'video/quicktime') {
        showStatus(); setStatus('Please choose a .MOV file.', 'error'); return;
      }
      selectedFile = file;
      fileNameEl.textContent = `${file.name}  (${fmtSize(file.size)})`;
      fileNameEl.style.display = 'block';
      dropzone.classList.add('has-file');
      dropzone.querySelector('.drop-label').textContent = 'File selected';
      convertBtn.disabled = false;
      hideDownload(); clearStatus(); hideStatus();
    }

    // ── Convert
    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      convertBtn.disabled = true;
      hideDownload();
      showStatus();
      setStatus('Reading file…');
      setProgress(20);

      try {
        const arrayBuffer = await selectedFile.arrayBuffer();

        setStatus('Converting container…');
        setProgress(60);

        // Yield to let the UI update before the synchronous work
        await new Promise(r => setTimeout(r, 30));

        const resultBuffer = swapFtyp(arrayBuffer);

        setProgress(90);
        setStatus('Preparing download…');
        await new Promise(r => setTimeout(r, 30));

        if (outputURL) URL.revokeObjectURL(outputURL);
        const blob = new Blob([resultBuffer], { type: 'video/mp4' });
        outputURL = URL.createObjectURL(blob);

        const outName = selectedFile.name.replace(/\.mov$/i, '') + '.mp4';
        downloadBtn.href        = outputURL;
        downloadBtn.download    = outName;
        downloadBtn.textContent = `⬇ Download ${outName}  (${fmtSize(blob.size)})`;

        setProgress(100);
        setStatus(`Done! ${fmtSize(blob.size)} MP4 ready.`, 'success');
        showDownload();

      } catch (err) {
        console.error(err);
        setStatus('Something went wrong: ' + (err.message || err), 'error');
        setProgress(0);
        convertBtn.disabled = false;
      }
    });

    // ── Core conversion: swap the ftyp box
    function swapFtyp(buf) {
      const view   = new DataView(buf);
      const uint8  = new Uint8Array(buf);
      let   offset = 0;

      while (offset + 8 <= buf.byteLength) {
        const boxSize = view.getUint32(offset, false);
        const boxType = fourCC(uint8, offset + 4);

        if (boxType === 'ftyp') {
          // Build a clean MP4 ftyp box
          const brands    = ['isom', 'iso2', 'avc1', 'mp41'];
          const newSize   = 16 + brands.length * 4; // header(8) + major(4) + version(4) + brands
          const newFtyp   = new Uint8Array(newSize);
          const newView   = new DataView(newFtyp.buffer);

          newView.setUint32(0, newSize, false);  // box size
          writeFourCC(newFtyp, 4, 'ftyp');       // box type
          writeFourCC(newFtyp, 8, 'isom');       // major brand
          newView.setUint32(12, 0x200, false);   // minor version

          for (let i = 0; i < brands.length; i++) {
            writeFourCC(newFtyp, 16 + i * 4, brands[i]);
          }

          // Splice: [before ftyp] + [new ftyp] + [after original ftyp]
          const oldFtypEnd = offset + boxSize;
          const result     = new Uint8Array(buf.byteLength - boxSize + newSize);
          result.set(uint8.subarray(0, offset));            // before
          result.set(newFtyp, offset);                      // new ftyp
          result.set(uint8.subarray(oldFtypEnd), offset + newSize); // after

          return result.buffer;
        }

        // Walk to next box
        if (boxSize === 1) {
          // 64-bit extended size — very rare but handle it
          const hi = view.getUint32(offset + 8, false);
          const lo = view.getUint32(offset + 12, false);
          offset += hi * 0x100000000 + lo;
        } else if (boxSize < 8) {
          break; // malformed
        } else {
          offset += boxSize;
        }
      }

      // ftyp not found — return the buffer unchanged and hope for the best
      console.warn('ftyp box not found; returning original buffer.');
      return buf;
    }

    // ── Helpers
    function fourCC(uint8, offset) {
      return String.fromCharCode(uint8[offset], uint8[offset+1], uint8[offset+2], uint8[offset+3]);
    }
    function writeFourCC(uint8, offset, str) {
      for (let i = 0; i < 4; i++) uint8[offset + i] = str.charCodeAt(i);
    }
    function fmtSize(b) {
      return b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
    }

    function showStatus()  { statusArea.classList.add('visible'); }
    function hideStatus()  { statusArea.classList.remove('visible'); }
    function clearStatus() {
      statusMsg.textContent = ''; statusMsg.className = '';
      progressFill.style.width = '0%';
    }
    function setStatus(msg, type) {
      statusMsg.textContent = msg; statusMsg.className = type || '';
    }
    function setProgress(pct) { progressFill.style.width = pct + '%'; }
    function showDownload() {
      downloadBtn.classList.add('visible');
      resetBtn.classList.add('visible');
      convertBtn.disabled = false;
    }
    function hideDownload() {
      downloadBtn.classList.remove('visible');
      resetBtn.classList.remove('visible');
    }

    resetBtn.addEventListener('click', () => {
      selectedFile = null;
      fileInput.value = '';
      fileNameEl.style.display = 'none';
      dropzone.classList.remove('has-file');
      dropzone.querySelector('.drop-label').textContent = 'Tap to choose a .MOV file';
      convertBtn.disabled = true;
      hideDownload(); clearStatus(); hideStatus();
    });
  </script>
</body>
</html>
