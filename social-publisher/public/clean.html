<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <title>Opening Social Publisher…</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b10;color:white;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.msg{text-align:center;padding:30px}.spin{width:42px;height:42px;border-radius:50%;border:4px solid #2b3140;border-top-color:#8b6fff;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;color:#8993a3;margin-top:8px}</style>
</head>
<body>
  <div class="msg"><div class="spin"></div><strong>Opening a clean copy…</strong><small>No installed-app cache is being used.</small></div>
  <script>
    (async () => {
      const stamp = Date.now();
      try {
        const response = await fetch('/index.html?fresh=' + stamp, { cache:'reload', headers:{ accept:'text/html' } });
        if (!response.ok) throw new Error('Could not load Social Publisher.');
        let html = await response.text();
        const assets = ['styles.css','app.js','reach-intelligence.js','passkeys.js'];
        for (const asset of assets) {
          html = html.replaceAll('/' + asset + '"', '/' + asset + '?fresh=' + stamp + '"');
          html = html.replaceAll('/' + asset + "'", '/' + asset + '?fresh=' + stamp + "'");
        }
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="msg"><strong>Could not open Social Publisher</strong><small>Close this tab and try the reset link again.</small></div>';
      }
    })();
  </script>
</body>
</html>
