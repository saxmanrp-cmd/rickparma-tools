<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Invoice Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #130101;
    --panel: #1c0a0a;
    --panel-2: #240f0f;
    --accent: #8DB2E5;
    --text: #F5F5F5;
    --text-dim: #C9C9C9;
    --border: #3a2a2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    padding-bottom: 40px;
  }
  h1, h2, h3, .brand { font-family: 'Josefin Sans', sans-serif; }
  header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  header h1 { margin: 0; font-size: 20px; color: var(--accent); font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--text-dim); }
  nav {
    display: flex; gap: 8px; padding: 10px 16px 0;
  }
  nav button {
    flex: 1; padding: 10px 8px; font-size: 14px; font-family: 'Josefin Sans', sans-serif;
    background: var(--panel); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 8px; font-weight: 600; letter-spacing: 0.02em;
  }
  nav button.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  section.card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  section.card h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 10px 0 4px; }
  input, textarea, select {
    width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-family: 'Lato', sans-serif;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  button.btn {
    font-size: 15px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font-weight: 700; font-family: 'Josefin Sans', sans-serif;
    width: 100%; margin-top: 10px;
  }
  button.btn.solid { background: var(--accent); color: var(--bg); }
  button.btn.danger { border-color: #C97B7B; color: #E8A3A3; }
  button.btn.small { width: auto; padding: 8px 12px; font-size: 13px; margin-top: 0; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { margin-top: 0; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.4; }
  .line-item { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .line-item .desc { flex: 3; }
  .line-item .amt { flex: 1; }
  .remove-x {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; width: 42px; height: 42px; font-size: 16px;
  }
  .payment-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .payment-row span { flex: 1; }
  .balance-box { text-align: center; padding: 14px; border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; }
  .balance-box .amt { font-size: 26px; font-weight: 700; color: var(--accent); font-family: 'Josefin Sans', sans-serif; }
  .status-badge {
    display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700;
    border: 1px solid var(--accent); color: var(--text); margin-top: 6px; letter-spacing: 0.03em;
  }
  .status-badge.paid { border-style: solid; }
  .status-badge.deposit { border-style: dashed; }
  .status-badge.unpaid { border-style: solid; border-color: var(--border); color: var(--text-dim); }
  .hist-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .hist-card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .hist-card .name { font-weight: 700; font-size: 15px; }
  .hist-card .amt { font-weight: 700; color: var(--accent); }
  .hist-card .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 10px; font-size: 14px; }
  #view-print { display: none; }
  #view-print.showing {
    display: block; background: #fff; color: #1a1a1a; padding: 32px 28px; border-radius: 8px;
    font-family: Georgia, 'Times New Roman', serif; max-width: 680px; margin: 0 auto;
    overflow-x: hidden; box-sizing: border-box;
  }
  #view-print .p-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #1a1a1a; padding-bottom: 16px; margin-bottom: 20px; }
  #view-print .biz-name { font-size: 21px; font-weight: 700; letter-spacing: 0.02em; }
  #view-print .biz-detail { font-size: 12.5px; color: #444; line-height: 1.55; margin-top: 5px; }
  #view-print .doc-title { text-align: right; }
  #view-print .doc-title h2 { margin: 0; font-size: 25px; letter-spacing: 0.08em; }
  #view-print .doc-title .meta { font-size: 12.5px; color: #444; margin-top: 8px; line-height: 1.6; }
  #view-print .bill-to { margin-bottom: 18px; }
  #view-print .bill-to .label { font-size: 11px; letter-spacing: 0.09em; color: #777; text-transform: uppercase; margin-bottom: 5px; }
  #view-print .bill-to .name { font-size: 16px; font-weight: 700; }
  #view-print .bill-to .detail { font-size: 13.5px; color: #333; line-height: 1.55; margin-top: 2px; }
  #view-print .event-line { font-size: 13.5px; margin: 14px 0 2px; color: #333; }
  #view-print table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  #view-print thead th {
    background: #f2f2f2; border-bottom: 2px solid #1a1a1a; padding: 9px 10px; text-align: left;
    font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: #333;
  }
  #view-print td { padding: 10px; border-bottom: 1px solid #ddd; }
  #view-print th.amt, #view-print td.amt { text-align: right; }
  #view-print .total-row td { border-top: 2px solid #1a1a1a; border-bottom: none; font-weight: 700; font-size: 16.5px; padding-top: 12px; }
  #view-print .note-box { border: 1px solid #ccc; border-radius: 6px; padding: 12px 14px; font-size: 13px; margin-top: 14px; background: #fafafa; line-height: 1.6; }
  #view-print .note-box a { color: #1a1a1a; text-decoration: underline; font-weight: 700; }
  #view-print .sig-grid { display: flex; gap: 24px; margin-top: 54px; }
  #view-print .sig-col { flex: 1; min-width: 0; }
  #view-print .sig-col .sig-slot { height: 55px; display: flex; align-items: flex-end; overflow: hidden; }
  #view-print .sig-col img { max-height: 55px; max-width: 100%; width: auto; height: auto; object-fit: contain; }
  #view-print .sig-col .line { border-top: 1px solid #1a1a1a; margin-top: 6px; padding-top: 5px; font-size: 11.5px; color: #555; }
  #view-print .sig-col .printed { font-size: 13px; margin-top: 3px; font-weight: 700; }
  #view-print .sig-col .date-line { font-size: 12.5px; color: #555; margin-top: 2px; }
  #view-print .thanks { margin-top: 26px; font-size: 13.5px; color: #444; text-align: center; font-style: italic; }
  .sign-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-top: 24px; color: var(--text); font-family: 'Lato', sans-serif;
  }
  .sign-card h2 { color: var(--accent); font-size: 15px; margin: 0 0 10px; font-family: 'Josefin Sans', sans-serif; }
  .sign-card input {
    width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  }
  #cursive-canvas { width: 100%; background: #fff; border-radius: 8px; margin-top: 10px; }
  .pay-link {
    display: inline-block; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent);
    color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 700; font-family: 'Josefin Sans', sans-serif;
  }
  body.client-mode nav,
  body.client-mode #view-history,
  body.client-mode #view-form,
  body.client-mode #print-admin-controls { display: none !important; }
  @media print {
    header, nav, #view-history, #view-form, .no-print { display: none !important; }
    #view-print { display: block !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<header>
  <h1 class="brand">Invoice Creator</h1>
  <p>Richard Parma — Sax/Vocals</p>
  <p id="sync-status" style="font-size:11px;color:var(--accent);margin-top:4px">Loading…</p>
</header>

<nav class="no-print">
  <button id="nav-history" onclick="showView('history')">History</button>
  <button id="nav-form" onclick="showView('form')">New / Edit</button>
</nav>

<main>

  <div id="view-history">
    <div id="history-list"></div>
  </div>

  <div id="view-form" style="display:none">

    <section class="card">
      <h2>Client Info</h2>
      <label>Client Name</label>
      <input id="f-name" type="text">
      <div class="row2">
        <div><label>Email</label><input id="f-email" type="email"></div>
        <div><label>Phone</label><input id="f-phone" type="tel"></div>
      </div>
      <label>Address</label>
      <textarea id="f-address" rows="2"></textarea>
    </section>

    <section class="card">
      <h2>Event Info</h2>
      <label>Event Type</label>
      <input id="f-eventtype" type="text" placeholder="Birthday, Wedding, Corporate...">
      <div class="row2">
        <div><label>Date</label><input id="f-date" type="date"></div>
      </div>
      <div class="row2">
        <div><label>Start Time</label><input id="f-timestart" type="time"></div>
        <div><label>End Time</label><input id="f-timeend" type="time"></div>
      </div>
    </section>

    <section class="card">
      <h2>Line Items</h2>
      <div id="line-items"></div>
      <button class="btn small" onclick="addLineItem()">+ Add Line Item</button>
    </section>

    <section class="card">
      <h2>Payments</h2>
      <div id="payments-list"></div>
      <div class="row2" style="margin-top:6px">
        <div><label>Amount</label><input id="pay-amt" type="number" step="0.01"></div>
        <div><label>Method</label>
          <select id="pay-method">
            <option>Zelle</option><option>Venmo</option><option>CashApp</option>
            <option>PayPal</option><option>Card</option><option>Check</option><option>Cash</option>
          </select>
        </div>
      </div>
      <button class="btn small" onclick="addPayment()" style="margin-top:8px">+ Add Payment</button>

      <div class="balance-box">
        <div class="amt" id="balance-amt">$0</div>
        <div id="status-badge" class="status-badge unpaid">UNPAID</div>
      </div>
    </section>

    <div class="btn-row no-print">
      <button class="btn solid" onclick="saveInvoice()">Save</button>
      <button class="btn" onclick="renderPrintView(); showView('print')">Print / Share PDF</button>
    </div>
    <div class="btn-row no-print">
      <button class="btn solid" onclick="shareForSignature()">Share for Signature</button>
    </div>
    <div class="btn-row no-print">
      <button class="btn" onclick="clearForm()">New Invoice</button>
      <button class="btn danger" id="delete-btn" style="display:none" onclick="deleteInvoice()">Delete</button>
    </div>
  </div>

  <div id="view-print">
    <div class="no-print btn-row" id="print-admin-controls">
      <button class="btn solid" onclick="window.print()">Print / Save as PDF</button>
      <button class="btn" onclick="showView('form')">Back to Edit</button>
    </div>
    <div id="print-content"></div>
  </div>

</main>

function nextInvoiceNumber() {
  const nums = invoices.map(i => parseInt(i.invoiceNumber) || 0);
  return (nums.length ? Math.max(...nums) : 1000) + 1;
}

const JSONBIN_KEY = "$2a$10$AE8jTzF3OJJNfqTgYPcPK.SzVAdv0Mqi/obwqWTuQjpE0dOkYkCE.";
const BIN_ID_KEY = "rp-invoice-bin-id";
const CACHE_KEY = "rp-invoices-cache";

const urlParams = new URLSearchParams(location.search);
const signId = urlParams.get('sign');
const urlBinId = urlParams.get('bin');

function setSyncStatus(text) {
  const el = document.getElementById('sync-status');
  if (el) el.textContent = text;
}

async function ensureBin() {
  if (urlBinId) return urlBinId;
  let binId = localStorage.getItem(BIN_ID_KEY);
  if (binId) return binId;
  const res = await fetch('https://api.jsonbin.io/v3/b', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': JSONBIN_KEY,
      'X-Bin-Name': 'rickparma-invoices'
    },
    body: JSON.stringify({ invoices: [] })
  });
  const data = await res.json();
  binId = data.metadata.id;
  localStorage.setItem(BIN_ID_KEY, binId);
  return binId;
}

async function loadInvoices() {
  setSyncStatus('Loading…');
  const cached = localStorage.getItem(CACHE_KEY);
  invoices = cached ? JSON.parse(cached) : [];
  renderHistory();
  try {
    const binId = await ensureBin();
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await res.json();
    invoices = (data.record && data.record.invoices) || [];
    localStorage.setItem(CACHE_KEY, JSON.stringify(invoices));
    setSyncStatus('Synced');
    renderHistory();
  } catch (e) {
    setSyncStatus('Offline — showing last saved copy');
  }
}

async function persistInvoices() {
  localStorage.setItem(CACHE_KEY, JSON.stringify(invoices));
  setSyncStatus('Saving…');
  try {
    const binId = await ensureBin();
    await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ invoices })
    });
    setSyncStatus('Synced');
  } catch (e) {
    setSyncStatus('Saved locally (sync failed — check connection)');
  }
}

function showView(name) {
  document.getElementById('view-history').style.display = name === 'history' ? 'block' : 'none';
  document.getElementById('view-form').style.display = name === 'form' ? 'block' : 'none';
  document.getElementById('view-print').classList.toggle('showing', name === 'print');
  document.getElementById('nav-history').classList.toggle('active', name === 'history');
  document.getElementById('nav-form').classList.toggle('active', name === 'form');
  if (name === 'history') renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!invoices.length) {
    list.innerHTML = '<div class="empty">No invoices yet. Tap "New / Edit" to create one.</div>';
    return;
  }
  const sorted = [...invoices].sort((a,b) => (b.eventDate||'').localeCompare(a.eventDate||''));
  list.innerHTML = sorted.map(inv => {
    const total = lineItemsTotal(inv.lineItems);
    const paid = paymentsTotal(inv.payments);
    const bal = total - paid;
    const status = statusFor(total, paid);
    const signedBadge = inv.clientSignatureImg ? '<div class="status-badge paid">✓ CLIENT SIGNED</div>' : '';
    return `<div class="hist-card" onclick="editInvoice('${inv.id}')">
      <div class="top"><span class="name">${esc(inv.clientName||'Untitled')}</span><span class="amt">$${total.toFixed(2)}</span></div>
      <div class="meta">${esc(inv.eventType||'')} — ${inv.eventDate||'no date'}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <div class="status-badge ${status.cls}">${status.label}${bal>0 && paid>0 ? ' ($'+bal.toFixed(2)+' due)' : ''}</div>
        ${signedBadge}
      </div>
    </div>`;
  }).join('');
}

function statusFor(total, paid) {
  if (paid <= 0) return {cls:'unpaid', label:'UNPAID'};
  if (paid >= total) return {cls:'paid', label:'PAID IN FULL ✓'};
  return {cls:'deposit', label:'DEPOSIT: $'+paid.toFixed(2)+' OF $'+total.toFixed(2)};
}

function lineItemsTotal(items) { return (items||[]).reduce((s,i)=>s+(parseFloat(i.amount)||0),0); }
function paymentsTotal(pmts) { return (pmts||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0); }

function esc(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function clearForm() {
  currentId = null;
  currentInvoiceNumber = null;
  lineItems = [{description:'Solo performance', amount:''}];
  payments = [];
  ['f-name','f-email','f-phone','f-address','f-eventtype','f-date','f-timestart','f-timeend'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('delete-btn').style.display = 'none';
  renderLineItems();
  renderPayments();
  updateBalance();
  showView('form');
}

function editInvoice(id) {
  const inv = invoices.find(i => i.id === id);
  if (!inv) return;
  currentId = id;
  currentInvoiceNumber = inv.invoiceNumber || null;
  document.getElementById('f-name').value = inv.clientName || '';
  document.getElementById('f-email').value = inv.clientEmail || '';
  document.getElementById('f-phone').value = inv.clientPhone || '';
  document.getElementById('f-address').value = inv.clientAddress || '';
  document.getElementById('f-eventtype').value = inv.eventType || '';
  document.getElementById('f-date').value = inv.eventDate || '';
  document.getElementById('f-timestart').value = inv.timeStart || '';
  document.getElementById('f-timeend').value = inv.timeEnd || '';
  lineItems = inv.lineItems && inv.lineItems.length ? JSON.parse(JSON.stringify(inv.lineItems)) : [{description:'',amount:''}];
  payments = inv.payments ? JSON.parse(JSON.stringify(inv.payments)) : [];
  document.getElementById('delete-btn').style.display = 'block';
  renderLineItems();
  renderPayments();
  updateBalance();
  showView('form');
}

function deleteInvoice() {
  if (!currentId) return;
  if (!confirm('Delete this invoice? This cannot be undone.')) return;
  invoices = invoices.filter(i => i.id !== currentId);
  persistInvoices();
  clearForm();
  showView('history');
}

function addLineItem() {
  lineItems.push({description:'', amount:''});
  renderLineItems();
}
function removeLineItem(idx) {
  lineItems.splice(idx,1);
  renderLineItems();
  updateBalance();
}
function renderLineItems() {
  const el = document.getElementById('line-items');
  el.innerHTML = lineItems.map((li, idx) => `
    <div class="line-item">
      <div class="desc"><label>Description</label><input type="text" value="${esc(li.description)}" onchange="lineItems[${idx}].description=this.value"></div>
      <div class="amt"><label>Amount</label><input type="number" step="0.01" value="${li.amount}" onchange="lineItems[${idx}].amount=this.value; updateBalance()"></div>
      <button class="remove-x" onclick="removeLineItem(${idx})">✕</button>
    </div>
  `).join('');
}

function addPayment() {
  const amt = parseFloat(document.getElementById('pay-amt').value);
  const method = document.getElementById('pay-method').value;
  if (!amt || amt <= 0) { alert('Enter a payment amount first.'); return; }
  payments.push({date: todayLocal(), amount: amt, method});
  document.getElementById('pay-amt').value = '';
  renderPayments();
  updateBalance();
}
function removePayment(idx) {
  payments.splice(idx,1);
  renderPayments();
  updateBalance();
}
function renderPayments() {
  const el = document.getElementById('payments-list');
  if (!payments.length) { el.innerHTML = '<div class="hint">No payments recorded yet.</div>'; return; }
  el.innerHTML = payments.map((p, idx) => `
    <div class="payment-row">
      <span>${p.date} — ${esc(p.method)}${p.source === 'client' ? ` (client-reported, ${p.type === 'partial' ? 'partial' : 'full'})` : ''}</span>
      <span>$${parseFloat(p.amount).toFixed(2)}</span>
      <button class="remove-x" onclick="removePayment(${idx})">✕</button>
    </div>
  `).join('');
}

function updateBalance() {
  const total = lineItemsTotal(lineItems);
  const paid = paymentsTotal(payments);
  const bal = total - paid;
  document.getElementById('balance-amt').textContent = '$' + bal.toFixed(2) + (paid>0 ? ' due' : '');
  const status = statusFor(total, paid);
  const badge = document.getElementById('status-badge');
  badge.className = 'status-badge ' + status.cls;
  badge.textContent = status.label;
}

function collectFormData() {
  if (!currentInvoiceNumber) {
    const existing = currentId ? invoices.find(i => i.id === currentId) : null;
    currentInvoiceNumber = (existing && existing.invoiceNumber) ? existing.invoiceNumber : nextInvoiceNumber();
  }
  const existingInv = currentId ? invoices.find(i => i.id === currentId) : null;
  const createdAt = (existingInv && existingInv.createdAt) ? existingInv.createdAt : todayLocal();
  return {
    id: currentId || ('inv_' + Date.now()),
    invoiceNumber: currentInvoiceNumber,
    createdAt: createdAt,
    clientName: document.getElementById('f-name').value,
    clientEmail: document.getElementById('f-email').value,
    clientPhone: document.getElementById('f-phone').value,
    clientAddress: document.getElementById('f-address').value,
    eventType: document.getElementById('f-eventtype').value,
    eventDate: document.getElementById('f-date').value,
    timeStart: document.getElementById('f-timestart').value,
    timeEnd: document.getElementById('f-timeend').value,
    lineItems: lineItems.filter(li => li.description || li.amount),
    payments: payments,
    clientSignatureImg: existingInv ? existingInv.clientSignatureImg : undefined,
    clientSignDate: existingInv ? existingInv.clientSignDate : undefined,
    clientSignedName: existingInv ? existingInv.clientSignedName : undefined
  };
}

async function saveInvoiceCore() {
  const data = collectFormData();
  currentId = data.id;
  const idx = invoices.findIndex(i => i.id === currentId);
  if (idx >= 0) invoices[idx] = data; else invoices.push(data);
  await persistInvoices();
  document.getElementById('delete-btn').style.display = 'block';
  renderHistory();
}

async function saveInvoice() {
  await saveInvoiceCore();
  alert('Invoice saved.');
}

async function shareForSignature() {
  await saveInvoiceCore();
  const binId = await ensureBin();
  const url = `${location.origin}${location.pathname}?sign=${encodeURIComponent(currentId)}&bin=${encodeURIComponent(binId)}`;
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Invoice from Richard Parma', text: 'Please review and sign your invoice.', url });
    } catch (e) { /* user cancelled share */ }
  } else {
    try {
      await navigator.clipboard.writeText(url);
      alert('Link copied! Paste it into a text or email to your client:\n\n' + url);
    } catch (e) {
      prompt('Copy this link to send to your client:', url);
    }
  }
}

function fmtTime(t) {
  if (!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')}${ap}`;
}

function todayLocal() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function fmtDateLong(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-').map(Number);
  const dt = new Date(y, m-1, day);
  return dt.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}

function buildInvoiceBody(data, total) {
  const rows = data.lineItems.map(li =>
    `<tr><td>${esc(li.description)}</td><td class="amt">$${parseFloat(li.amount||0).toFixed(2)}</td></tr>`
  ).join('');
  const timeRange = data.timeStart && data.timeEnd ? `${fmtTime(data.timeStart)} – ${fmtTime(data.timeEnd)}` : (fmtTime(data.timeStart) || '');
  return `
    <div class="p-top">
      <div>
        <div class="biz-name">${BIZ.name}</div>
        <div class="biz-detail">${BIZ.address}<br>${BIZ.phone} &nbsp;•&nbsp; ${BIZ.email}</div>
      </div>
      <div class="doc-title">
        <h2>INVOICE</h2>
        <div class="meta">
          No. ${data.invoiceNumber}<br>
          Issued ${fmtDateLong(data.createdAt)}
        </div>
      </div>
    </div>

    <div class="bill-to">
      <div class="label">Bill To</div>
      <div class="name">${esc(data.clientName)}</div>
      <div class="detail">
        ${esc(data.clientAddress).replace(/\n/g,'<br>')}<br>
        ${esc(data.clientPhone)}${data.clientPhone && data.clientEmail ? ' &nbsp;•&nbsp; ' : ''}${esc(data.clientEmail)}
      </div>
    </div>

    <div class="event-line">
      <strong>${(data.eventType||'Event').toUpperCase()}</strong> &nbsp;—&nbsp;
      ${fmtDateLong(data.eventDate)}${timeRange ? ', ' + timeRange : ''}
    </div>

    <table>
      <thead><tr><th>Description</th><th class="amt">Amount</th></tr></thead>
      <tbody>
        ${rows}
        <tr class="total-row"><td>Total</td><td class="amt">$${total.toFixed(2)}</td></tr>
      </tbody>
    </table>

    <div class="note-box">
      <strong>Requirements:</strong> Access to power at the performance location.<br>
      <strong>Payment:</strong> <a href="${BIZ.venmo}" target="_blank" rel="noopener">Venmo</a>,
      <a href="${BIZ.cashapp}" target="_blank" rel="noopener">CashApp</a>,
      <a href="${BIZ.zelleLink}" target="_blank" rel="noopener">Zelle</a> (${BIZ.zelle}),
      <a href="${BIZ.paypal}" target="_blank" rel="noopener">PayPal</a>, or credit card.
      Checks payable to ${BIZ.name}.
    </div>
  `;
}

function renderPrintView() {
  const data = collectFormData();
  const total = lineItemsTotal(data.lineItems);
  const body = buildInvoiceBody(data, total);

  const rickSigBlock = savedSignature ? `<img src="${savedSignature}">` : '';
  const clientSigCol = data.clientSignatureImg
    ? `<div class="sig-slot"><img src="${data.clientSignatureImg}"></div><div class="line">${esc(data.clientName)}</div><div class="date-line">Signed ${fmtDateLong(data.clientSignDate)}</div>`
    : `<div class="sig-slot"></div><div class="line">Client Signature</div><div class="date-line">Date: _______________</div>`;

  document.getElementById('print-content').innerHTML = `
    ${body}
    <div class="sig-grid">
      <div class="sig-col">${clientSigCol}</div>
      <div class="sig-col">
        <div class="sig-slot">${rickSigBlock}</div>
        <div class="line">${BIZ.name}</div>
        <div class="date-line">Date: ${fmtDateLong(data.createdAt)}</div>
      </div>
    </div>
    <p class="thanks">Thank you for your business!</p>
  `;
}

async function drawCursive(name) {
  const canvas = document.getElementById('cursive-canvas');
  if (!canvas) return;
  try { await document.fonts.load("52px 'Dancing Script'"); } catch (e) {}
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#111';
  let size = 52;
  ctx.font = `${size}px 'Dancing Script', cursive`;
  while (ctx.measureText(name).width > canvas.width - 40 && size > 18) {
    size -= 2;
    ctx.font = `${size}px 'Dancing Script', cursive`;
  }
  ctx.fillText(name, 20, canvas.height / 2 + size / 3);
}

async function initClientView(invId) {
  document.getElementById('print-content').innerHTML = '<p style="padding:20px;text-align:center;color:#8DB2E5">Loading invoice…</p>';
  try {
    const binId = await ensureBin();
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, { headers: { 'X-Master-Key': JSONBIN_KEY } });
    const data = await res.json();
    const list = (data.record && data.record.invoices) || [];
    const inv = list.find(i => i.id === invId);
    if (!inv) {
      document.getElementById('print-content').innerHTML = '<p style="padding:20px;text-align:center">Invoice not found. Please contact Richard Parma directly.</p>';
      return;
    }
    renderClientInvoice(inv);
  } catch (e) {
    document.getElementById('print-content').innerHTML = '<p style="padding:20px;text-align:center">Could not load invoice. Check your connection and reload the page.</p>';
  }
}

function renderClientInvoice(inv) {
  const total = lineItemsTotal(inv.lineItems);
  const body = buildInvoiceBody(inv, total);
  const actions = `<div class="no-print btn-row" style="margin-bottom:16px"><button class="btn" onclick="window.print()">Print This Copy</button></div>`;

  let sigSection;
  if (inv.clientSignatureImg) {
    const clientPayment = (inv.payments || []).find(p => p.source === 'client');
    const paymentNote = clientPayment
      ? `<p style="text-align:center;font-size:13.5px;color:#444;margin-top:10px">Payment reported: $${parseFloat(clientPayment.amount).toFixed(2)} (${clientPayment.type === 'partial' ? 'Partial Payment' : 'Paid in Full'}) via ${esc(clientPayment.method)}</p>`
      : '';
    sigSection = `
      <div class="sig-grid">
        <div class="sig-col">
          <div class="sig-slot"><img src="${inv.clientSignatureImg}"></div>
          <div class="line">${esc(inv.clientSignedName || inv.clientName)}</div>
          <div class="date-line">Signed ${fmtDateLong(inv.clientSignDate)}</div>
        </div>
        <div class="sig-col">
          <div class="sig-slot">${savedSignature ? '<img src="'+savedSignature+'">' : ''}</div>
          <div class="line">${BIZ.name}</div>
          <div class="date-line">Date: ${fmtDateLong(inv.createdAt)}</div>
        </div>
      </div>
      ${paymentNote}
      <p class="thanks">Thank you — this invoice has been signed and confirmed.</p>
    `;
  } else {
    sigSection = `
      <div class="sign-card no-print">
        <h2>Payment</h2>
        <label style="display:block;font-size:13px;color:#C9C9C9;margin-bottom:6px">Tap to pay</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <a class="pay-link" href="${BIZ.venmo}" target="_blank" rel="noopener">Venmo</a>
          <a class="pay-link" href="${BIZ.cashapp}" target="_blank" rel="noopener">Cash App</a>
          <a class="pay-link" href="${BIZ.zelleLink}" target="_blank" rel="noopener">Zelle</a>
          <a class="pay-link" href="${BIZ.paypal}" target="_blank" rel="noopener">PayPal</a>
        </div>
        <label style="display:block;font-size:13px;color:#C9C9C9;margin-bottom:4px">Payment Method</label>
        <select id="client-pay-method">
          <option>Zelle</option><option>Venmo</option><option>CashApp</option>
          <option>PayPal</option><option>Card</option><option>Check</option><option>Cash</option>
        </select>
        <label style="display:block;font-size:13px;color:#C9C9C9;margin:10px 0 4px">Payment Type</label>
        <select id="client-pay-type" onchange="toggleClientPartialAmount()">
          <option value="full">Paying in Full ($${total.toFixed(2)})</option>
          <option value="partial">Partial Payment</option>
        </select>
        <div id="client-partial-amount-wrap" style="display:none">
          <label style="display:block;font-size:13px;color:#C9C9C9;margin:10px 0 4px">Amount</label>
          <input id="client-pay-amount" type="number" step="0.01">
        </div>
      </div>

      <div class="sign-card no-print">
        <h2>Sign This Invoice</h2>
        <label style="display:block;font-size:13px;color:#C9C9C9;margin-bottom:4px">Type your full name</label>
        <input id="client-name-input" type="text" oninput="drawCursive(this.value)">
        <canvas id="cursive-canvas" width="500" height="110"></canvas>
        <label style="display:block;font-size:13px;color:#C9C9C9;margin:10px 0 4px">Date</label>
        <input id="client-date-input" type="date">
        <button class="btn solid" style="margin-top:14px" onclick="submitClientSignature('${inv.id}')">Confirm &amp; Send Signed Copy</button>
      </div>
    `;
  }

  document.getElementById('print-content').innerHTML = actions + body + sigSection;
  const dateInput = document.getElementById('client-date-input');
  if (dateInput) dateInput.value = todayLocal();
}

function toggleClientPartialAmount() {
  const type = document.getElementById('client-pay-type').value;
  document.getElementById('client-partial-amount-wrap').style.display = type === 'partial' ? 'block' : 'none';
}

async function submitClientSignature(invId) {
  const nameInput = document.getElementById('client-name-input');
  const dateInput = document.getElementById('client-date-input');
  const canvas = document.getElementById('cursive-canvas');
  if (!nameInput.value.trim()) { alert('Please type your name to generate your signature.'); return; }
  const btn = document.querySelector('.sign-card .btn.solid');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const sigDataUrl = canvas.toDataURL('image/png');
    const binId = await ensureBin();
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, { headers: { 'X-Master-Key': JSONBIN_KEY } });
    const data = await res.json();
    const list = (data.record && data.record.invoices) || [];
    const idx = list.findIndex(i => i.id === invId);
    if (idx < 0) { alert('Could not find this invoice anymore. Please contact Richard Parma directly.'); return; }

    const payMethod = document.getElementById('client-pay-method').value;
    const payType = document.getElementById('client-pay-type').value;
    const total = lineItemsTotal(list[idx].lineItems);
    const payAmount = payType === 'full' ? total : (parseFloat(document.getElementById('client-pay-amount').value) || 0);
    if (payAmount > 0) {
      list[idx].payments = list[idx].payments || [];
      list[idx].payments.push({
        date: todayLocal(),
        amount: payAmount,
        method: payMethod,
        source: 'client',
        type: payType
      });
    }

    list[idx].clientSignatureImg = sigDataUrl;
    list[idx].clientSignDate = dateInput.value || todayLocal();
    list[idx].clientSignedName = nameInput.value.trim();
    await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify({ invoices: list })
    });
    renderClientInvoice(list[idx]);
  } catch (e) {
    alert('Could not send. Check your connection and try again.');
    btn.disabled = false;
    btn.textContent = 'Confirm & Send Signed Copy';
  }
}

if (signId) {
  document.body.classList.add('client-mode');
  document.getElementById('view-print').classList.add('showing');
  initClientView(signId);
} else {
  loadInvoices();
  clearForm();
  showView('history');
}
</script>
