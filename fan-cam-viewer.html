<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fan Cam — Inbox</title>

<!-- Home screen icon — PNGs live in the shared /images folder -->
<link rel="apple-touch-icon" href="images/fan-cam-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="images/fan-cam-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="images/fan-cam-icon-167.png">
<link rel="icon" href="images/fan-cam-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fan Cam">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#130101">

<!--
  SETUP: use the same JSONBIN_ID and JSONBIN_KEY you set in
  fan-cam.html, plus a passcode of your choosing. This is a
  simple gate, not real security — don't link to this page
  publicly, just bookmark it yourself.
-->
<script>
  const CONFIG = {
    cloudName: "ffgvgf5j",
    jsonbinId: "6a668bb8f5f4af5e29c51472",
    jsonbinKey: "$2a$10$AE8jTzF3OJJNfqTgYPcPK.SzVAdv0Mqi/obwqWTuQjpE0dOkYkCE.",
    passcode: "Success7848"
  };
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=Lato:wght@400;700&display=swap');
  :root{ --bg:#130101; --panel:#1c0606; --accent:#8DB2E5; --white:#F5F0EA; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--white);
    font-family:'Lato',sans-serif; padding:20px 14px 50px; -webkit-tap-highlight-color:transparent;}
  h1{font-family:'Josefin Sans',sans-serif; font-weight:700; letter-spacing:.04em;
    font-size:1.4rem; text-align:center; margin:6px 0 20px;}

  .gate{max-width:320px; margin:60px auto 0; text-align:center;}
  .gate input{width:100%; padding:13px; font-size:16px; border-radius:10px;
    border:1px solid rgba(141,178,229,.4); background:var(--panel); color:var(--white); margin-bottom:12px;}
  .gate button{width:100%; padding:13px; border-radius:10px; border:none; background:var(--accent);
    color:#0d1420; font-family:'Josefin Sans',sans-serif; font-weight:600; font-size:16px; cursor:pointer;}
  .gate .err{color:#e5527a; font-size:.85rem; min-height:1.2em; margin-top:8px;}
  .gate .faceid-btn{
    background:transparent; color:var(--accent); border:1px solid rgba(141,178,229,.5) !important;
    margin-bottom:12px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .gate .gate-divider{text-align:center; color:#7a6a6a; font-size:.78rem; margin:2px 0 12px;
    font-family:'Josefin Sans',sans-serif; letter-spacing:.05em;}

  .faceid-banner{max-width:320px; margin:0 auto 16px; text-align:center; display:none;}
  .faceid-banner a{color:var(--accent); font-family:'Josefin Sans',sans-serif; font-weight:600;
    font-size:.85rem; text-decoration:underline; cursor:pointer;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:#0d1420; padding:10px 18px; border-radius:20px;
    font-family:'Josefin Sans',sans-serif; font-weight:600; font-size:.88rem; opacity:0;
    pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;
    max-width:960px; margin:0 auto; display:none;}
  .card{background:var(--panel); border-radius:10px; overflow:hidden; border:1px solid rgba(141,178,229,.15);}
  .card .thumb{display:block; width:100%; border:none; padding:0; background:none; cursor:pointer;}
  .card img, .card video{width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#000;}
  .card .meta{padding:8px 10px 4px; font-size:.78rem; color:#c9b8b8;}
  .card .who{color:var(--accent); font-family:'Josefin Sans',sans-serif; font-size:.85rem; display:block;}

  .actions{display:flex; border-top:1px solid rgba(141,178,229,.15);}
  .actions button{
    flex:1; background:none; border:none; color:var(--white); opacity:.75;
    padding:10px 4px; cursor:pointer; border-right:1px solid rgba(141,178,229,.15);
    display:flex; align-items:center; justify-content:center;
  }
  .actions button:last-child{border-right:none;}
  .actions button:active{opacity:1; background:rgba(141,178,229,.12);}
  .actions button.danger:active{color:#e5527a;}

  .empty{text-align:center; color:#c9b8b8; margin-top:60px; display:none;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(19,1,1,.78); display:none;
    align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid rgba(141,178,229,.25); border-radius:14px;
    padding:22px 20px; max-width:340px; width:100%;
  }
  .modal p{margin:0 0 16px; font-size:.95rem; line-height:1.45;}
  .modal label{display:flex; align-items:center; gap:8px; font-size:.85rem; color:#c9b8b8;
    margin-bottom:18px; cursor:pointer;}
  .modal label input{width:16px; height:16px; accent-color:var(--accent);}
  .modal .modal-actions{display:flex; gap:10px;}
  .modal .modal-actions button{
    flex:1; padding:12px 10px; border-radius:9px; border:none; font-size:15px;
    font-family:'Josefin Sans',sans-serif; font-weight:600; cursor:pointer;
  }
  .modal .cancel-btn{background:transparent; color:var(--white); border:1px solid rgba(245,240,234,.35) !important;}
  .modal .confirm-btn{background:#e5527a; color:var(--white);}
</style>
</head>
<body>
  <h1>🎷 Fan Cam Inbox</h1>

  <div class="gate" id="gate">
    <button type="button" class="faceid-btn" id="faceIdBtn" style="display:none;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V6a2 2 0 0 1 2-2h3"/><path d="M4 15v3a2 2 0 0 0 2 2h3"/><path d="M20 9V6a2 2 0 0 0-2-2h-3"/><path d="M20 15v3a2 2 0 0 1-2 2h-3"/><path d="M9 10v1"/><path d="M15 10v1"/><path d="M9 15c.7.7 1.8 1 3 1s2.3-.3 3-1"/></svg>
      Unlock with Face ID
    </button>
    <div class="gate-divider" id="gateDivider" style="display:none;">or use your passcode</div>
    <input type="password" id="pass" placeholder="Passcode">
    <button id="unlockBtn">Unlock</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div class="faceid-banner" id="faceIdBanner">
    <a id="enableFaceIdLink">Enable Face ID unlock for next time</a>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No submissions yet — check back after the next gig.</div>
  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <p>Permanently delete this? It'll be removed from your inbox for good.</p>
      <label><input type="checkbox" id="rememberChoice"> Don't ask me this again</label>
      <div class="modal-actions">
        <button class="cancel-btn" id="modalCancel">Cancel</button>
        <button class="confirm-btn" id="modalConfirm">Delete permanently</button>
      </div>
    </div>
  </div>

<script>
let currentEntries = [];

const FACEID_ENABLED_KEY = 'fancamFaceIdEnabled';
const FACEID_CREDID_KEY = 'fancamFaceIdCredId';

document.getElementById('unlockBtn').addEventListener('click', ()=>unlock('passcode'));
document.getElementById('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock('passcode'); });
document.getElementById('faceIdBtn').addEventListener('click', ()=> attemptFaceIdUnlock(true));
document.getElementById('enableFaceIdLink').addEventListener('click', (e)=>{ e.preventDefault(); enableFaceId(); });

function bufToBase64(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function base64ToBuf(b64){
  const s = b64.replace(/-/g,'+').replace(/_/g,'/');
  const pad = s.length % 4 ? '='.repeat(4 - (s.length % 4)) : '';
  const bin = atob(s + pad);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function faceIdSupported(){
  return !!(window.PublicKeyCredential);
}

async function enableFaceId(){
  try{
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: 'Fan Cam Inbox' },
        user: {
          id: crypto.getRandomValues(new Uint8Array(16)),
          name: 'rick-parma-fan-cam',
          displayName: 'Fan Cam Inbox'
        },
        pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000,
        attestation: 'none'
      }
    });
    localStorage.setItem(FACEID_CREDID_KEY, bufToBase64(cred.rawId));
    localStorage.setItem(FACEID_ENABLED_KEY, 'true');
    document.getElementById('faceIdBanner').style.display = 'none';
    showToast('Face ID unlock enabled');
  }catch(err){
    showToast("Couldn't enable Face ID on this device");
  }
}

async function attemptFaceIdUnlock(isManualTap){
  const credId = localStorage.getItem(FACEID_CREDID_KEY);
  if(!credId) return false;
  try{
    await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ id: base64ToBuf(credId), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    document.getElementById('gate').style.display = 'none';
    loadEntries();
    return true;
  }catch(err){
    if(isManualTap) document.getElementById('gateErr').textContent = 'Face ID failed — try your passcode instead.';
    return false;
  }
}

function unlock(source){
  if(source === 'passcode'){
    const val = document.getElementById('pass').value;
    if(val !== CONFIG.passcode){
      document.getElementById('gateErr').textContent = 'Not quite — try again.';
      return;
    }
  }
  document.getElementById('gate').style.display = 'none';

  const alreadyEnabled = localStorage.getItem(FACEID_ENABLED_KEY) === 'true';
  if(source === 'passcode' && faceIdSupported() && !alreadyEnabled){
    document.getElementById('faceIdBanner').style.display = 'block';
  }

  loadEntries();
}

(async function initLock(){
  const enabled = localStorage.getItem(FACEID_ENABLED_KEY) === 'true';
  if(enabled && faceIdSupported()){
    document.getElementById('faceIdBtn').style.display = 'flex';
    document.getElementById('gateDivider').style.display = 'block';
    const ok = await attemptFaceIdUnlock(false);
    if(ok) return;
  }
  // fall through to showing the passcode gate as-is
})();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

async function fetchLatest(){
  const res = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.jsonbinId}/latest`, {
    headers:{ 'X-Master-Key': CONFIG.jsonbinKey }
  });
  const data = await res.json();
  return Array.isArray(data.record) ? data.record : [];
}

async function loadEntries(){
  try{
    currentEntries = await fetchLatest();
    renderGrid();
  }catch(err){
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent = "Couldn't load submissions — check your connection.";
  }
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if(currentEntries.length === 0){
    grid.style.display = 'none';
    empty.style.display = 'block';
    empty.textContent = 'No submissions yet — check back after the next gig.';
    return;
  }
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = currentEntries.map(entryToCard).join('');
}

const ICONS = {
  share: `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`
};

function entryToCard(e, idx){
  const when = e.timestamp ? new Date(e.timestamp).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
  const media = e.kind === 'video'
    ? `<video src="${e.mediaUrl}" controls playsinline></video>`
    : `<img src="${e.mediaUrl}" loading="lazy" alt="fan photo">`;
  return `<div class="card">
    <button class="thumb" onclick="window.open('${e.mediaUrl}','_blank')">${media}</button>
    <div class="meta"><span class="who">${escapeHtml(e.name || 'A fan')}</span>${when}</div>
    <div class="actions">
      <button aria-label="Share" onclick="shareMedia(${idx})">${ICONS.share}</button>
      <button class="danger" aria-label="Delete" onclick="deleteEntry(${idx})">${ICONS.trash}</button>
    </div>
  </div>`;
}

async function shareMedia(idx){
  const entry = currentEntries[idx];
  if(!entry) return;
  const shareText = `${entry.name || 'A fan'} at a Rick Parma show 🎷`;
  try{
    if(navigator.canShare){
      const res = await fetch(entry.mediaUrl);
      const blob = await res.blob();
      const ext = entry.kind === 'video' ? 'mp4' : 'jpg';
      const file = new File([blob], `fancam.${ext}`, {type: blob.type});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text: shareText});
        return;
      }
    }
    if(navigator.share){
      await navigator.share({url: entry.mediaUrl, text: shareText});
      return;
    }
    await navigator.clipboard.writeText(entry.mediaUrl);
    showToast('Link copied — paste it anywhere');
  }catch(err){
    if(err.name !== 'AbortError'){
      try{
        await navigator.clipboard.writeText(entry.mediaUrl);
        showToast('Link copied — paste it anywhere');
      }catch(e2){
        showToast("Couldn't share — try again");
      }
    }
  }
}

let pendingDeleteIdx = null;
const SKIP_KEY = 'fancamSkipDeleteConfirm';

document.getElementById('modalCancel').addEventListener('click', ()=>{
  pendingDeleteIdx = null;
  document.getElementById('modalOverlay').classList.remove('show');
});
document.getElementById('modalConfirm').addEventListener('click', ()=>{
  if(document.getElementById('rememberChoice').checked){
    localStorage.setItem(SKIP_KEY, 'true');
  }
  document.getElementById('modalOverlay').classList.remove('show');
  const idx = pendingDeleteIdx;
  pendingDeleteIdx = null;
  if(idx !== null) performDelete(idx);
});

function deleteEntry(idx){
  if(localStorage.getItem(SKIP_KEY) === 'true'){
    performDelete(idx);
    return;
  }
  pendingDeleteIdx = idx;
  document.getElementById('rememberChoice').checked = false;
  document.getElementById('modalOverlay').classList.add('show');
}

async function performDelete(idx){
  const entry = currentEntries[idx];
  if(!entry) return;
  showToast('Deleting…');

  let storageCleared = false;
  if(entry.deleteToken){
    try{
      const resourceType = entry.kind === 'video' ? 'video' : 'image';
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudName}/${resourceType}/delete_by_token`, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: new URLSearchParams({token: entry.deleteToken})
      });
      const result = await res.json().catch(()=>({}));
      storageCleared = result.result === 'ok';
    }catch(err){ /* fall through — still remove from the list below */ }
  }

  try{
    const fresh = await fetchLatest();
    const updated = fresh.filter(e => e.mediaUrl !== entry.mediaUrl);
    await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.jsonbinId}`, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Master-Key': CONFIG.jsonbinKey },
      body: JSON.stringify(updated)
    });
    currentEntries = updated;
    renderGrid();
    showToast(storageCleared ? 'Permanently deleted' : 'Removed — it was uploaded over 10 min ago, so storage cleanup could not run');
  }catch(err){
    showToast("Couldn't delete — try again");
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
