name: Fuel
options:
  bundleIdPrefix: com.rickparma
  deploymentTarget:
    iOS: "17.0"
targets:
  Fuel:
    type: application
    platform: iOS
    sources:
      - Fuel
    info:
      path: Fuel/Info.plist
      properties:
        CFBundleDisplayName: Fuel
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Fuel reads activity, sleep, heart rate, weight, and body composition from Apple Health so your nutrition and progress dashboard can stay up to date.
        NSMicrophoneUsageDescription: Fuel uses the microphone when you tap Talk to Fuel Coach so it can hear your question.
        NSSpeechRecognitionUsageDescription: Fuel converts your spoken Fuel Coach questions into text so the coach can answer them.
    entitlements:
      path: Fuel/Fuel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickparma.fuel
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
