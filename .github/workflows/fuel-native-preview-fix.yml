name: Fuel Native Preview Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuel-native-preview-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Finish native barcode camera preview repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fuel-tracker/ios/Fuel/ContentView.swift')
          s = p.read_text()

          old_layout = '''    override func layoutSubviews() {
              super.layoutSubviews()
              previewLayer?.frame = previewHost.bounds
          }

          '''
          # Also handle the file's normal four-space Swift indentation exactly.
          old_layout_exact = "    override func layoutSubviews() {\n        super.layoutSubviews()\n        previewLayer?.frame = previewHost.bounds\n    }\n\n"
          s = s.replace(old_layout, '', 1)
          s = s.replace(old_layout_exact, '', 1)

          if 'previewLayer?.frame' in s:
              raise SystemExit('Stale previewLayer layout reference remains')
          if 'private let previewHost = FuelBarcodePreviewView()' not in s:
              raise SystemExit('Preview host is not using FuelBarcodePreviewView')
          if 'layer.session = session' not in s:
              raise SystemExit('Capture session is not attached to preview backing layer')

          p.write_text(s)
          PY
      - name: Validate Swift source text
        run: |
          grep -q 'override class var layerClass: AnyClass { AVCaptureVideoPreviewLayer.self }' fuel-tracker/ios/Fuel/ContentView.swift
          grep -q 'private let previewHost = FuelBarcodePreviewView()' fuel-tracker/ios/Fuel/ContentView.swift
          grep -q 'layer.session = session' fuel-tracker/ios/Fuel/ContentView.swift
          ! grep -q 'previewLayer?.frame' fuel-tracker/ios/Fuel/ContentView.swift
          git diff --check
      - name: Commit preview repair cleanup
        run: |
          git config user.name 'Fuel Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fuel-tracker/ios/Fuel/ContentView.swift
          git diff --cached --quiet && exit 0
          git commit -m 'Complete native Fuel barcode preview fix'
          git push origin HEAD:main
