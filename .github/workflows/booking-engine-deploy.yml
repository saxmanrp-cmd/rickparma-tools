name: Booking Engine Deploy

on:
  push:
    branches:
      - booking-engine-v1
    paths:
      - 'booking-engine-worker/**'
      - '.github/workflows/booking-engine-deploy.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: booking-engine-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-engine-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: booking-engine-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0 | sort -z)

      - name: Deploy Worker
        run: npm run deploy

      - name: Live health smoke test
        run: |
          curl --fail --silent --show-error --max-time 20             https://rick-booking-engine.saxmanrp.workers.dev/api/health | tee /tmp/booking-health.json
          grep -q '"ok":true' /tmp/booking-health.json

      - name: Report deploy success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='booking-engine/deploy' -f description='Booking Engine Worker deploy succeeded'

      - name: Report deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='booking-engine/deploy' -f description='Booking Engine Worker deploy failed'
