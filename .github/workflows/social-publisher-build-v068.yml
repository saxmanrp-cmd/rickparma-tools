name: Social Publisher v0.6.8 Build

on:
  push:
    branches:
      - social-publisher-v0.6.8-performance-learning
    paths:
      - social-publisher/tools/build-v068.mjs
      - social-publisher/tools/v068-performance-snippet.txt
      - social-publisher/tools/v068-reach-full.txt
      - .github/workflows/social-publisher-build-v068.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-publisher-v0.6.8-performance-learning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.6.8
        run: node social-publisher/tools/build-v068.mjs
      - name: Install
        working-directory: social-publisher
        run: npm ci
      - name: Test
        working-directory: social-publisher
        run: npm test
      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-publisher
          if git diff --cached --quiet; then
            echo "No build changes to commit"
            exit 0
          fi
          git commit -m "Build Social Publisher v0.6.8 Performance Learning"
          git push origin HEAD:social-publisher-v0.6.8-performance-learning
