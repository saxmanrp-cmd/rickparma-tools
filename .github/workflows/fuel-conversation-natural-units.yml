name: Fuel Natural Units and Coach Memory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuel-conversation-natural-units.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade Fuel
        run: python .github/scripts/fuel_natural_units_upgrade.py
      - name: Check Fuel JavaScript
        working-directory: fuel-tracker
        run: |
          node --check src/index.js
          node --check src/fuel-coach-api.js
          node --check public/app.js
          node --check public/fuel-coach.js
          node --check public/portion-editor.js
          node --check public/quick-add.js
      - name: Run Fuel tests
        working-directory: fuel-tracker
        run: npm test
      - name: Commit Fuel upgrade
        run: |
          git config user.name 'Fuel Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fuel-tracker
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Make Fuel portions natural and Coach conversational'
          git push origin HEAD:main
