name: Fuel App Shell Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuel-conversation-natural-units.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild Fuel native shell
        run: python .github/scripts/fuel_native_shell_nav_upgrade.py
      - name: Check Fuel JavaScript
        working-directory: fuel-tracker
        run: |
          node --check src/index.js
          node --check src/fuel-coach-api.js
          node --check public/app.js
          node --check public/fuel-coach.js
          node --check public/portion-editor.js
      - name: Run Fuel tests
        working-directory: fuel-tracker
        run: npm test
      - name: Commit Fuel native shell rebuild
        run: |
          git config user.name 'Fuel Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fuel-tracker
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Move Fuel iPhone navigation into native shell'
          git push origin HEAD:main

# Native architecture pass only; older one-time patch scripts are intentionally not rerun.
