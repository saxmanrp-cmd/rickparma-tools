name: Lyrics Finder Deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lyrics-finder/**'
      - '.github/workflows/lyrics-finder-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'lyrics-finder/**'
      - '.github/workflows/lyrics-finder-deploy.yml'

permissions:
  contents: read

concurrency:
  group: lyrics-finder-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyrics-finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyrics-finder
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run deploy
      - name: Live health smoke test
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Health check attempt $attempt"
            if curl --fail --silent --show-error --max-time 15 \
              https://rick-lyrics-finder.saxmanrp.workers.dev/api/health \
              -o /tmp/lyrics-health.json; then
              cat /tmp/lyrics-health.json
              if grep -q '"ok":true' /tmp/lyrics-health.json; then
                exit 0
              fi
            fi
            sleep 3
          done
          echo 'Lyrics Finder health check did not become ready.'
          exit 1
