name: Booking Engine Intervention SMS Test

on:
  push:
    branches:
      - booking-engine-v1
    paths:
      - '.github/workflows/booking-engine-intervention-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-engine-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: booking-engine-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Arm one-time test and send
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          SQL="UPDATE autopilot_config SET config_json=json_set(COALESCE(config_json,'{}'),'$.interventionTestToken','$TOKEN'), updated_at=CURRENT_TIMESTAMP WHERE id='default';"
          npx wrangler d1 execute rick-booking-crm --remote --command "$SQL" >/tmp/arm.txt
          RESPONSE="$(curl --fail --silent --show-error --max-time 25 "https://rick-booking-engine.saxmanrp.workers.dev/api/internal/intervention-test?token=$TOKEN")"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
