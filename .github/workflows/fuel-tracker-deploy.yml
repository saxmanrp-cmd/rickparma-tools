name: Fuel Tracker Deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'fuel-tracker/**'
      - 'nutrition-tracker.html'
      - '.github/workflows/fuel-tracker-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'fuel-tracker/**'
      - 'nutrition-tracker.html'
      - '.github/workflows/fuel-tracker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: fuel-tracker-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuel-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuel-tracker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run deploy
      - name: Live health smoke test
        run: |
          curl --fail --silent --show-error --max-time 15 \
            https://rick-fuel-tracker.saxmanrp.workers.dev/api/health | tee /tmp/fuel-health.json
          grep -q '"ok":true' /tmp/fuel-health.json
      - name: Live typed meal AI test
        run: |
          START=$(date +%s)
          curl --fail --silent --show-error --max-time 45 \
            -F 'text=8 oz ribeye, 3 eggs, 2 slices bacon' \
            https://rick-fuel-tracker.saxmanrp.workers.dev/api/fuel/analyze \
            -o /tmp/fuel-ai.json
          END=$(date +%s)
          cat /tmp/fuel-ai.json
          echo "AI response time: $((END-START)) seconds"
          grep -q '"ok":true' /tmp/fuel-ai.json

# Release trigger: Coach natural log commands, delayed auto-listen retry, and JSON envelope defense.
