name: Inspect SMS Blast Worker Route

on:
  push:
    branches:
      - booking-engine-v1
    paths:
      - '.github/workflows/inspect-sms-blast.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fetch current SMS worker script
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/sms-blast" \
            -o /tmp/sms-worker
          echo "BYTES=$(wc -c </tmp/sms-worker)"
          grep -a -n -C 25 -E "conversations/reply|X-Admin-Token|Unauthorized" /tmp/sms-worker | head -n 260 || true
          echo "---- METADATA ----"
          grep -a -n -A 80 'name="metadata"' /tmp/sms-worker | head -n 100 || true
