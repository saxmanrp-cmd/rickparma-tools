name: Social Publisher CI

on:
  push:
    branches: [main, social-publisher-dev]
    paths:
      - 'social-publisher/**'
      - '.github/workflows/social-publisher-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'social-publisher/**'
      - '.github/workflows/social-publisher-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
