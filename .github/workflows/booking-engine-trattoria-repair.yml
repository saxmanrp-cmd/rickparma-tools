name: Repair Trattoria Reggiano booking contact

on:
  push:
    branches:
      - booking-engine-v1
    paths:
      - 'booking-engine-worker/trattoria-repair.trigger'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-engine-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: booking-engine-worker/package-lock.json
      - run: npm ci
      - name: Replace bounced Trattoria contact route
        run: |
          npx wrangler d1 execute rick-booking-crm --remote --command "UPDATE prospects SET contact_name='Russell Moffatt', contact_role='Group Sales Manager', email='rmoffatt@fifth-group.com', phone='+17024812062', contact_route='email', status='Research Needed', automation_safe='MANUAL', campaign_active=0, next_action_at=NULL, verified_at=NULL, metadata_json=json_set(COALESCE(metadata_json,'{}'),'$.invalidEmails',json_array('events@fifth-group.com'),'$.lastBounceEmail','events@fifth-group.com') WHERE lower(entity) LIKE '%trattoria reggiano%' OR lower(COALESCE(email,''))='events@fifth-group.com';"
      - name: Verify repair
        run: |
          npx wrangler d1 execute rick-booking-crm --remote --command "SELECT id,entity,contact_name,contact_role,email,phone,status,automation_safe,campaign_active FROM prospects WHERE lower(entity) LIKE '%trattoria reggiano%' OR lower(COALESCE(email,''))='rmoffatt@fifth-group.com';"
