name: Social Publisher v0.6.6.1 Patch

on:
  push:
    branches: [social-publisher-dev]
    paths:
      - 'social-publisher/scripts/patch-0661.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-publisher-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 social-publisher/scripts/patch-0661.py
      - name: Install and test
        working-directory: social-publisher
        run: |
          npm ci
          npm test
      - name: Commit clean release
        run: |
          rm -f social-publisher/scripts/patch-0661.py
          rm -f .github/workflows/social-publisher-v0661-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Threads video retries and failed-only retry"
          git push origin social-publisher-dev
