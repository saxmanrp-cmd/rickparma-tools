name: Social Publisher v0.6.6 Upgrade

on:
  push:
    branches: [social-publisher-dev]
    paths:
      - '.github/workflows/social-publisher-v066-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-publisher-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.6.6 source upgrade
        run: python3 social-publisher/scripts/upgrade-066.py
      - name: Validate v0.6.6
        working-directory: social-publisher
        run: |
          npm install
          npm test
      - name: Commit upgraded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-publisher
          git commit -m "Add Max Reach and Facebook Reel publishing"
          git push origin HEAD:social-publisher-dev
