name: Social Publisher Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'social-publisher/**'

permissions:
  contents: read

concurrency:
  group: social-publisher-production
  cancel-in-progress: false

jobs:
  test-migrate-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-publisher
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: social-publisher/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Apply D1 migrations
        run: npm run db:migrate

      - name: Deploy Worker
        run: npm run deploy
