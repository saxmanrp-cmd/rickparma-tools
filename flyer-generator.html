<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flyer Generator">
<meta name="theme-color" content="#0a0a0f">
<title>Flyer Generator — AI Powered</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --border: #2a2a3a;
  --blue: #8DB2E5;
  --blue-dim: rgba(141,178,229,0.12);
  --blue-border: rgba(141,178,229,0.3);
  --text: #f0eef8;
  --text-dim: rgba(240,238,248,0.45);
  --green: #4caf7d;
  --red: #e05555;
  --gold: #f0c060;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  padding: 0 0 80px;
}

/* ── Header ── */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 20px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.app-header-inner {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.app-title {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--blue);
}

.ai-toggle {
  display: flex;
  gap: 6px;
}

.ai-btn {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.ai-btn.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #0a0a0f;
}

/* ── Main ── */
.main {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 20px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  margin-top: 28px;
}

.section-header:first-child { margin-top: 0; }

.section-label {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--blue);
}

.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

.optional-tag {
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 2px 8px;
}

/* ── Form fields ── */
.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.field label .req {
  color: var(--blue);
  margin-left: 2px;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  font-family: Arial, Helvetica, sans-serif;
  padding: 11px 14px;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: var(--blue-border);
}

.field input::placeholder,
.field textarea::placeholder {
  color: var(--text-dim);
}

.field select option {
  background: var(--surface2);
  color: var(--text);
}

.field textarea {
  resize: vertical;
  min-height: 80px;
  line-height: 1.5;
}

.field-row {
  display: flex;
  gap: 10px;
}

.field-row .field {
  flex: 1;
}

/* ── Style chips ── */
.style-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 7px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.chip.selected {
  background: var(--blue-dim);
  border-color: var(--blue);
  color: var(--blue);
}

/* ── Size selector ── */
.size-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.size-card {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.size-card.selected {
  border-color: var(--blue);
  background: var(--blue-dim);
}

.size-icon {
  margin: 0 auto 6px;
  background: var(--border);
  border-radius: 3px;
}

.size-card.selected .size-icon {
  background: var(--blue);
  opacity: 0.6;
}

.size-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.06em;
}

.size-card.selected .size-name { color: var(--blue); }

.size-dim {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* ── Generate button ── */
.generate-wrap {
  margin-top: 32px;
}

.generate-btn {
  width: 100%;
  background: var(--blue);
  color: #0a0a0f;
  border: none;
  border-radius: 10px;
  padding: 16px;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.generate-btn:active { transform: scale(0.98); background: #aecbf0; }
.generate-btn:disabled { opacity: 0.4; cursor: default; }

/* ── Output area ── */
.output-section {
  margin-top: 32px;
  display: none;
}

.output-section.visible { display: block; }

.output-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.output-actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 7px 14px;
  border-radius: 6px;
  border: 1.5px solid var(--blue-border);
  background: transparent;
  color: var(--blue);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.action-btn:hover { background: var(--blue-dim); }

/* ── Flyer preview ── */
.flyer-preview {
  width: 100%;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 300px;
}

.flyer-preview img {
  width: 100%;
  display: block;
  border-radius: 10px;
}

/* ── Prompt box ── */
.prompt-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  font-size: 12px;
  font-family: monospace;
  color: var(--text-dim);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  margin-top: 14px;
}

/* ── Loading state ── */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 16px;
  width: 100%;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--blue-border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── Error state ── */
.error-box {
  background: rgba(224,85,85,0.1);
  border: 1.5px solid rgba(224,85,85,0.3);
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 13px;
  color: var(--red);
  line-height: 1.5;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--blue);
  color: #0a0a0f;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 22px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 999;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Divider ── */
.or-divider {
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin: 12px 0;
  position: relative;
}

.or-divider::before, .or-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 44%;
  height: 1px;
  background: var(--border);
}

.or-divider::before { left: 0; }
.or-divider::after { right: 0; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="app-title">🎨 AI Flyer Generator</div>
    <div class="ai-toggle">
      <button class="ai-btn active" id="btn-dalle" onclick="setAI('dalle')">DALL·E</button>
      <button class="ai-btn" id="btn-prompt" onclick="setAI('prompt')">Prompt Only</button>
    </div>
  </div>
</header>

<div class="main">

  <!-- REQUIRED FIELDS -->
  <div class="section-header">
    <div class="section-label">Event Details</div>
    <div class="section-line"></div>
  </div>

  <div class="field">
    <label>Event Name <span class="req">*</span></label>
    <input type="text" id="event-name" placeholder="e.g. Rick Parma Live at The Venue">
  </div>

  <div class="field-row">
    <div class="field">
      <label>Date <span class="req">*</span></label>
      <input type="date" id="event-date">
    </div>
    <div class="field">
      <label>Time <span class="req">*</span></label>
      <input type="time" id="event-time">
    </div>
  </div>

  <div class="field">
    <label>Venue Name <span class="req">*</span></label>
    <input type="text" id="venue-name" placeholder="e.g. The Jazz Lounge">
  </div>

  <div class="field">
    <label>Venue Address <span class="req">*</span></label>
    <input type="text" id="venue-address" placeholder="e.g. 123 Main St, Las Vegas, NV">
  </div>

  <div class="field">
    <label>Performer / Artist Name <span class="req">*</span></label>
    <input type="text" id="performer" placeholder="e.g. Rick Parma">
  </div>

  <div class="field-row">
    <div class="field">
      <label>Website <span class="req">*</span></label>
      <input type="text" id="website" placeholder="e.g. rickparma.com">
    </div>
    <div class="field">
      <label>Social Handle <span class="req">*</span></label>
      <input type="text" id="social" placeholder="e.g. @rickparma">
    </div>
  </div>

  <!-- OPTIONAL FIELDS -->
  <div class="section-header">
    <div class="section-label">Optional Details</div>
    <div class="section-line"></div>
    <div class="optional-tag">Optional</div>
  </div>

  <div class="field">
    <label>Special Guests</label>
    <input type="text" id="guests" placeholder="e.g. Featuring DJ Smooth">
  </div>

  <div class="field">
    <label>Event Description / Tagline</label>
    <textarea id="description" placeholder="e.g. A night of R&B, funk & soul — dress to impress!"></textarea>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Age Restriction</label>
      <select id="age">
        <option value="">None</option>
        <option value="18+">18+</option>
        <option value="21+">21+</option>
        <option value="All Ages">All Ages</option>
      </select>
    </div>
    <div class="field">
      <label>Dress Code</label>
      <select id="dresscode">
        <option value="">None</option>
        <option value="Casual">Casual</option>
        <option value="Smart Casual">Smart Casual</option>
        <option value="Business Casual">Business Casual</option>
        <option value="Formal">Formal</option>
        <option value="Black Tie">Black Tie</option>
        <option value="Theme / Costume">Theme / Costume</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Theme / Vibe</label>
    <input type="text" id="theme" placeholder="e.g. 70s Soul, Elegant Night, Summer Rooftop">
  </div>

  <div class="field">
    <label>Sponsors</label>
    <input type="text" id="sponsors" placeholder="e.g. Hennessy, Local Radio Station">
  </div>

  <div class="field">
    <label>QR Code Link</label>
    <input type="url" id="qr-link" placeholder="e.g. https://tickets.com/event">
  </div>

  <!-- STYLE -->
  <div class="section-header">
    <div class="section-label">Flyer Style</div>
    <div class="section-line"></div>
  </div>

  <div class="field">
    <label>Visual Style</label>
    <div class="style-chips" id="style-chips">
      <button class="chip selected" onclick="toggleChip(this)">Bold & Colorful</button>
      <button class="chip" onclick="toggleChip(this)">Elegant & Minimal</button>
      <button class="chip" onclick="toggleChip(this)">Dark & Moody</button>
      <button class="chip" onclick="toggleChip(this)">Retro / Vintage</button>
      <button class="chip" onclick="toggleChip(this)">Neon / Club</button>
      <button class="chip" onclick="toggleChip(this)">Urban / Street</button>
      <button class="chip" onclick="toggleChip(this)">Luxury / Gold</button>
      <button class="chip" onclick="toggleChip(this)">Tropical / Outdoor</button>
    </div>
  </div>

  <div class="field" style="margin-top:14px">
    <label>Color Palette</label>
    <div class="style-chips" id="color-chips">
      <button class="chip selected" onclick="toggleChip(this, 'color-chips')">Black & Gold</button>
      <button class="chip" onclick="toggleChip(this, 'color-chips')">Purple & Silver</button>
      <button class="chip" onclick="toggleChip(this, 'color-chips')">Red & Black</button>
      <button class="chip" onclick="toggleChip(this, 'color-chips')">Blue & White</button>
      <button class="chip" onclick="toggleChip(this, 'color-chips')">Green & Gold</button>
      <button class="chip" onclick="toggleChip(this, 'color-chips')">Pink & Chrome</button>
      <button class="chip" onclick="toggleChip(this, 'color-chips')">Custom…</button>
    </div>
  </div>

  <!-- SIZE -->
  <div class="section-header" style="margin-top:20px">
    <div class="section-label">Flyer Size</div>
    <div class="section-line"></div>
  </div>

  <div class="size-grid">
    <div class="size-card selected" onclick="selectSize(this, '1080x1350')" data-size="1080x1350">
      <div class="size-icon" style="width:28px;height:35px;"></div>
      <div class="size-name">Portrait</div>
      <div class="size-dim">4:5 Instagram</div>
    </div>
    <div class="size-card" onclick="selectSize(this, '1080x1080')" data-size="1080x1080">
      <div class="size-icon" style="width:32px;height:32px;"></div>
      <div class="size-name">Square</div>
      <div class="size-dim">1:1 Post</div>
    </div>
    <div class="size-card" onclick="selectSize(this, '1920x1080')" data-size="1920x1080">
      <div class="size-icon" style="width:40px;height:23px;"></div>
      <div class="size-name">Landscape</div>
      <div class="size-dim">16:9 Facebook</div>
    </div>
    <div class="size-card" onclick="selectSize(this, '1080x1920')" data-size="1080x1920">
      <div class="size-icon" style="width:20px;height:36px;"></div>
      <div class="size-name">Story</div>
      <div class="size-dim">9:16 Story</div>
    </div>
    <div class="size-card" onclick="selectSize(this, '2550x3300')" data-size="2550x3300">
      <div class="size-icon" style="width:26px;height:34px;"></div>
      <div class="size-name">Print</div>
      <div class="size-dim">8.5×11 Letter</div>
    </div>
    <div class="size-card" onclick="selectSize(this, '1200x628')" data-size="1200x628">
      <div class="size-icon" style="width:38px;height:20px;"></div>
      <div class="size-name">Banner</div>
      <div class="size-dim">Facebook Event</div>
    </div>
  </div>

  <!-- GENERATE -->
  <div class="generate-wrap">
    <button class="generate-btn" id="generateBtn" onclick="generate()">✨ Generate Flyer</button>
  </div>

  <!-- OUTPUT -->
  <div class="output-section" id="outputSection">
    <div class="output-header">
      <div class="section-label" id="outputLabel">Generated Flyer</div>
      <div class="output-actions">
        <button class="action-btn" id="downloadBtn" onclick="downloadFlyer()" style="display:none">⬇ Save</button>
        <button class="action-btn" onclick="copyPrompt()">📋 Copy Prompt</button>
      </div>
    </div>
    <div class="flyer-preview" id="flyerPreview"></div>
    <div class="prompt-box" id="promptBox" style="display:none"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  var currentAI = "dalle";
  var selectedSize = "1080x1350";
  var lastPrompt = "";
  var lastImageUrl = "";

  var OPENAI_KEY = "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";

  function setAI(ai) {
    currentAI = ai;
    document.getElementById("btn-dalle").classList.toggle("active", ai === "dalle");
    document.getElementById("btn-prompt").classList.toggle("active", ai === "prompt");
  }

  function toggleChip(el, groupId) {
    // For style chips allow multi-select, for color single-select
    if (groupId === "color-chips") {
      document.querySelectorAll("#color-chips .chip").forEach(function(c){ c.classList.remove("selected"); });
      el.classList.add("selected");
    } else {
      el.classList.toggle("selected");
    }
  }

  function selectSize(el, size) {
    document.querySelectorAll(".size-card").forEach(function(c){ c.classList.remove("selected"); });
    el.classList.add("selected");
    selectedSize = size;
  }

  function buildPrompt() {
    var name      = document.getElementById("event-name").value.trim();
    var date      = document.getElementById("event-date").value;
    var time      = document.getElementById("event-time").value;
    var venue     = document.getElementById("venue-name").value.trim();
    var address   = document.getElementById("venue-address").value.trim();
    var performer = document.getElementById("performer").value.trim();
    var website   = document.getElementById("website").value.trim();
    var social    = document.getElementById("social").value.trim();
    var guests    = document.getElementById("guests").value.trim();
    var desc      = document.getElementById("description").value.trim();
    var age       = document.getElementById("age").value;
    var dress     = document.getElementById("dresscode").value;
    var theme     = document.getElementById("theme").value.trim();
    var sponsors  = document.getElementById("sponsors").value.trim();

    var styles = [];
    document.querySelectorAll("#style-chips .chip.selected").forEach(function(c){ styles.push(c.textContent.trim()); });
    var colorChip = document.querySelector("#color-chips .chip.selected");
    var color = colorChip ? colorChip.textContent.trim() : "Black & Gold";

    var sizeParts = selectedSize.split("x");
    var sizeLabel = document.querySelector(".size-card.selected .size-name").textContent;

    var dateFormatted = date ? new Date(date + "T00:00:00").toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" }) : "";
    var timeFormatted = time ? new Date("2000-01-01T" + time).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" }) : "";

    var prompt = "Create a professional event flyer image";
    prompt += " in " + sizeLabel + " format (" + selectedSize + " pixels)";
    prompt += " with a " + (styles.length ? styles.join(", ") : "bold") + " visual style";
    prompt += " using a " + color + " color palette";
    prompt += ".\n\n";
    prompt += "EVENT DETAILS TO INCLUDE ON THE FLYER:\n";
    prompt += "• Event: " + (name || "Live Music Event") + "\n";
    if (dateFormatted) prompt += "• Date: " + dateFormatted + "\n";
    if (timeFormatted) prompt += "• Time: " + timeFormatted + "\n";
    prompt += "• Performer: " + (performer || "Live Artist") + "\n";
    prompt += "• Venue: " + (venue || "The Venue") + "\n";
    if (address) prompt += "• Address: " + address + "\n";
    if (guests) prompt += "• Special Guests: " + guests + "\n";
    if (age) prompt += "• Age Restriction: " + age + "\n";
    if (dress) prompt += "• Dress Code: " + dress + "\n";
    if (website) prompt += "• Website: " + website + "\n";
    if (social) prompt += "• Social: " + social + "\n";
    if (sponsors) prompt += "• Sponsors: " + sponsors + "\n";
    if (desc) prompt += "\nTAGLINE / DESCRIPTION: " + desc + "\n";
    if (theme) prompt += "THEME / VIBE: " + theme + "\n";
    prompt += "\nDesign guidelines: Make it eye-catching and professional. The event name and performer should be the most prominent text. Use high contrast, crisp typography, and ensure all text is clearly legible. Include decorative elements that match the style and vibe. The flyer should look like it was designed by a professional graphic designer.";

    return prompt;
  }

  function validate() {
    var required = [
      { id: "event-name", label: "Event Name" },
      { id: "event-date", label: "Date" },
      { id: "event-time", label: "Time" },
      { id: "venue-name", label: "Venue Name" },
      { id: "venue-address", label: "Venue Address" },
      { id: "performer", label: "Performer Name" },
      { id: "website", label: "Website" },
      { id: "social", label: "Social Handle" }
    ];
    for (var i = 0; i < required.length; i++) {
      var el = document.getElementById(required[i].id);
      if (!el.value.trim()) {
        el.focus();
        el.style.borderColor = "var(--red)";
        setTimeout(function(e){ return function(){ e.style.borderColor = ""; }; }(el), 2000);
        showToast(required[i].label + " is required");
        return false;
      }
    }
    return true;
  }

  async function generate() {
    if (!validate()) return;

    var prompt = buildPrompt();
    lastPrompt = prompt;

    var section = document.getElementById("outputSection");
    var preview = document.getElementById("flyerPreview");
    var promptBox = document.getElementById("promptBox");
    var downloadBtn = document.getElementById("downloadBtn");

    section.classList.add("visible");
    section.scrollIntoView({ behavior: "smooth", block: "start" });
    downloadBtn.style.display = "none";
    promptBox.style.display = "none";
    lastImageUrl = "";

    if (currentAI === "prompt") {
      preview.innerHTML = "";
      promptBox.style.display = "block";
      promptBox.textContent = prompt;
      document.getElementById("outputLabel").textContent = "Your Flyer Prompt";
      return;
    }

    // DALL-E generation
    document.getElementById("outputLabel").textContent = "Generating Flyer…";
    preview.innerHTML = '<div class="loading-state"><div class="spinner"></div><div class="loading-text">Creating your flyer with DALL·E…</div></div>';

    try {
      var sizeParts = selectedSize.split("x");
      var w = parseInt(sizeParts[0]);
      var h = parseInt(sizeParts[1]);
      var ratio = w / h;
      var dalleSize = "1024x1024";
      if (ratio > 1.2) dalleSize = "1792x1024";
      else if (ratio < 0.85) dalleSize = "1024x1792";

      var res = await fetch("https://api.openai.com/v1/images/generations", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + OPENAI_KEY
        },
        body: JSON.stringify({
          model: "dall-e-3",
          prompt: prompt,
          n: 1,
          size: dalleSize,
          quality: "hd",
          style: "vivid"
        })
      });

      var data = await res.json();

      if (!res.ok) {
        throw new Error(data.error ? data.error.message : "Generation failed");
      }

      var imageUrl = data.data[0].url;
      lastImageUrl = imageUrl;

      preview.innerHTML = '<img src="' + imageUrl + '" alt="Generated flyer">';
      document.getElementById("outputLabel").textContent = "Your Flyer ✓";
      downloadBtn.style.display = "inline-block";
      promptBox.style.display = "block";
      promptBox.textContent = "PROMPT USED:\n" + prompt;

    } catch(e) {
      preview.innerHTML = '<div style="padding:20px;width:100%"><div class="error-box">⚠️ ' + (e.message || "Something went wrong. Check your API key and try again.") + '</div></div>';
      document.getElementById("outputLabel").textContent = "Generation Failed";
      promptBox.style.display = "block";
      promptBox.textContent = "You can copy this prompt and paste it into ChatGPT or another AI tool:\n\n" + prompt;
    }
  }

  function downloadFlyer() {
    if (!lastImageUrl) return;
    var a = document.createElement("a");
    a.href = lastImageUrl;
    a.download = "flyer.png";
    a.target = "_blank";
    a.click();
    showToast("Opening image — long press to save!");
  }

  function copyPrompt() {
    var text = lastPrompt || buildPrompt();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ showToast("Prompt copied!"); });
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-9999px;opacity:0;";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("Prompt copied!");
    }
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2500);
  }
</script>
</body>
