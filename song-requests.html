<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Song Requests — Rick Parma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130101;
  --card-solid:#1c0808;
  --accent:#8DB2E5;
  --white:#F5F3F0;
  --dim:#C9C2BC;
  --line:rgba(245,243,240,0.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:'Lato',sans-serif;}
body{background:linear-gradient(180deg, #130101 0%, #0c0000 100%); min-height:100vh; padding-bottom:40px;}
h1,h2,h3{font-family:'Josefin Sans',sans-serif; margin:0;}
header{padding:16px 16px 13px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px;}
header .eyebrow{letter-spacing:2px; text-transform:uppercase; font-size:14px; color:var(--accent); font-weight:700; margin-bottom:4px;}
header h1{font-size:32px; line-height:1;}
.back-link{font-size:16px; color:var(--dim); text-decoration:none; border:1px solid var(--line); padding:11px 12px; border-radius:9px; white-space:nowrap; flex-shrink:0;}
.section{padding:10px 14px 24px;}
#requestsStatusLine{color:var(--dim); font-size:20px; font-weight:900; padding:7px 2px 8px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:16px 20px; border-radius:13px; font-weight:900; font-size:22px; border:none; cursor:pointer; font-family:'Lato',sans-serif;}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--white);}
.btn-full{width:100%;}
.song-row{display:flex; align-items:center; gap:14px; min-height:calc((100dvh - 165px)/3); padding:20px 2px; border-bottom:2px solid var(--line);}
.song-info{flex:1; min-width:0;}
.song-title{font-size:40px; line-height:1.02; font-weight:900; letter-spacing:-0.6px; overflow-wrap:anywhere;}
.song-meta{font-size:30px; line-height:1.16; color:var(--dim); margin-top:12px; font-weight:700; overflow-wrap:anywhere;}
.dismiss-btn{width:66px; height:66px; min-width:66px; padding:0; border-radius:16px; font-size:34px;}
.empty-state{padding:32px 4px; color:var(--dim); font-size:30px; font-weight:700;}
.clear-btn{margin-top:22px; min-height:64px; font-size:22px;}
@media (max-width:390px){
  header{padding-left:12px; padding-right:12px;}
  header .eyebrow{font-size:12px;}
  header h1{font-size:28px;}
  .back-link{font-size:14px; padding:10px 9px;}
  .section{padding-left:12px; padding-right:12px;}
  #requestsStatusLine{font-size:18px;}
  .song-row{min-height:calc((100dvh - 155px)/3); gap:10px; padding:16px 0;}
  .song-title{font-size:36px;}
  .song-meta{font-size:27px; margin-top:10px;}
  .dismiss-btn{width:60px; height:60px; min-width:60px; font-size:30px;}
}
</style>
</head>
<body>
<header>
<div>
<div class="eyebrow">Admin Tool</div>
<h1>Song Requests</h1>
</div>
<a class="back-link" href="song-manager.html">&larr; Manager</a>
</header>
<div class="section">
<div id="requestsStatusLine"></div>
<div id="requestsList"></div>
<button class="btn btn-outline btn-full clear-btn" onclick="clearAllRequests()">Clear All</button>
</div>
<script>
const PROXY_BASE = "https://rickparma-jsonbin-proxy.saxmanrp.workers.dev";
const TEST_BOGO = new URLSearchParams(window.location.search).get('test') === 'bogo';
let testBogoDismissed = false;
let songRequests = [];

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function addTestBogo(requests){
  var list = Array.isArray(requests) ? requests.slice() : [];
  if(TEST_BOGO && !testBogoDismissed){
    list.unshift({
      id:'test-bogo',
      name:'BOGO',
      song:'Test Song Request',
      artist:'',
      outcome:'TEST',
      ts:Date.now()
    });
  }
  return list;
}

async function loadRequests(){
  try{
    const res = await fetch(`${PROXY_BASE}/song-requests-log`, {cache:'no-store'});
    const data = await res.json();
    songRequests = addTestBogo((data.record && data.record.requests) || []);
    renderRequests();
  }catch(e){
    if(TEST_BOGO){
      songRequests = addTestBogo([]);
      renderRequests();
    }
  }
}

function renderRequests(){
  var el = document.getElementById('requestsList');
  var status = document.getElementById('requestsStatusLine');
  if(!songRequests.length){
    el.innerHTML = '<div class="empty-state">No requests yet.</div>';
    status.textContent = '';
    return;
  }
  status.textContent = songRequests.length + ' request' + (songRequests.length===1?'':'s');
  var sorted = songRequests.slice().sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
  el.innerHTML = sorted.map(function(r){
    var when = r.ts ? new Date(r.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '';
    var songLabel = escapeHtml(r.song||'') + (r.artist ? ' — ' + escapeHtml(r.artist) : '');
    return '<div class="song-row" data-id="'+escapeHtml(r.id||'')+'"><div class="song-info"><div class="song-title">'+escapeHtml(r.name||'Someone')+'</div><div class="song-meta">'+songLabel+' · '+escapeHtml(r.outcome||'')+' · '+when+'</div></div><button class="btn btn-outline dismiss-btn" onclick="dismissRequest(\''+escapeHtml(r.id||'')+'\')">✓</button></div>';
  }).join('');
}

async function dismissRequest(id){
  if(id === 'test-bogo'){
    testBogoDismissed = true;
    songRequests = songRequests.filter(function(r){ return r.id !== id; });
    renderRequests();
    return;
  }
  songRequests = songRequests.filter(function(r){ return r.id !== id; });
  renderRequests();
  await saveRequestsToCloud();
}

async function saveRequestsToCloud(){
  try{
    var realRequests = songRequests.filter(function(r){ return r.id !== 'test-bogo'; });
    await fetch(`${PROXY_BASE}/song-requests-log`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ requests: realRequests })
    });
  }catch(e){}
}

async function clearAllRequests(){
  if(!confirm('Clear all requests from the list?')) return;
  songRequests = [];
  testBogoDismissed = true;
  renderRequests();
  await saveRequestsToCloud();
}

loadRequests();
setInterval(loadRequests, 5000);
</script>
</body>
</html>
