<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Song Requests — Rick Parma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130101;
  --card-solid:#1c0808;
  --accent:#8DB2E5;
  --white:#F5F3F0;
  --dim:#C9C2BC;
  --line:rgba(245,243,240,0.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:'Lato',sans-serif;}
body{background:linear-gradient(180deg, #130101 0%, #0c0000 100%); min-height:100vh; padding-bottom:60px;}
h1,h2,h3{font-family:'Josefin Sans',sans-serif; margin:0;}
header{padding:24px 20px 18px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
header .eyebrow{letter-spacing:2px; text-transform:uppercase; font-size:13px; color:var(--accent); font-weight:700; margin-bottom:7px;}
header h1{font-size:30px; line-height:1.05;}
.back-link{font-size:15px; color:var(--dim); text-decoration:none; border:1px solid var(--line); padding:10px 13px; border-radius:9px; white-space:nowrap; flex-shrink:0;}
.section{padding:20px;}
#requestsStatusLine{color:var(--dim); font-size:16px; font-weight:700; margin-bottom:12px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 17px; border-radius:10px; font-weight:700; font-size:16px; border:none; cursor:pointer; font-family:'Lato',sans-serif;}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--white);}
.btn-full{width:100%;}
.song-row{display:flex; align-items:center; gap:12px; padding:17px 4px; border-bottom:1px solid var(--line);}
.song-info{flex:1; min-width:0;}
.song-title{font-size:20px; line-height:1.2; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.song-meta{font-size:16px; line-height:1.35; color:var(--dim); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.empty-state{padding:24px 4px; color:var(--dim); font-size:17px;}
@media (max-width:390px){
  header{padding-left:16px; padding-right:16px;}
  header h1{font-size:27px;}
  .back-link{font-size:14px; padding:9px 10px;}
  .section{padding-left:16px; padding-right:16px;}
  .song-title{font-size:19px;}
  .song-meta{font-size:15px;}
}
</style>
</head>
<body>
<header>
<div>
<div class="eyebrow">Admin Tool</div>
<h1>Song Requests</h1>
</div>
<a class="back-link" href="song-manager.html">&larr; Song Manager</a>
</header>
<div class="section">
<div id="requestsStatusLine"></div>
<div id="requestsList"></div>
<button class="btn btn-outline btn-full" style="margin-top:14px;" onclick="clearAllRequests()">Clear All</button>
</div>
<script>
const PROXY_BASE = "https://rickparma-jsonbin-proxy.saxmanrp.workers.dev";
const TEST_BOGO = new URLSearchParams(window.location.search).get('test') === 'bogo';
let testBogoDismissed = false;
let songRequests = [];

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function addTestBogo(requests){
  var list = Array.isArray(requests) ? requests.slice() : [];
  if(TEST_BOGO && !testBogoDismissed){
    list.unshift({
      id:'test-bogo',
      name:'BOGO',
      song:'Test Song Request',
      artist:'',
      outcome:'TEST',
      ts:Date.now()
    });
  }
  return list;
}

async function loadRequests(){
  try{
    const res = await fetch(`${PROXY_BASE}/song-requests-log`, {cache:'no-store'});
    const data = await res.json();
    songRequests = addTestBogo((data.record && data.record.requests) || []);
    renderRequests();
  }catch(e){
    if(TEST_BOGO){
      songRequests = addTestBogo([]);
      renderRequests();
    }
  }
}

function renderRequests(){
  var el = document.getElementById('requestsList');
  var status = document.getElementById('requestsStatusLine');
  if(!songRequests.length){
    el.innerHTML = '<div class="empty-state">No requests yet.</div>';
    status.textContent = '';
    return;
  }
  status.textContent = songRequests.length + ' request' + (songRequests.length===1?'':'s');
  var sorted = songRequests.slice().sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
  el.innerHTML = sorted.map(function(r){
    var when = r.ts ? new Date(r.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '';
    var songLabel = escapeHtml(r.song||'') + (r.artist ? ' — ' + escapeHtml(r.artist) : '');
    return '<div class="song-row" data-id="'+escapeHtml(r.id||'')+'"><div class="song-info"><div class="song-title">'+escapeHtml(r.name||'Someone')+'</div><div class="song-meta">'+songLabel+' · '+escapeHtml(r.outcome||'')+' · '+when+'</div></div><button class="btn btn-outline" style="padding:10px 15px;" onclick="dismissRequest(\''+escapeHtml(r.id||'')+'\')">✓</button></div>';
  }).join('');
}

async function dismissRequest(id){
  if(id === 'test-bogo'){
    testBogoDismissed = true;
    songRequests = songRequests.filter(function(r){ return r.id !== id; });
    renderRequests();
    return;
  }
  songRequests = songRequests.filter(function(r){ return r.id !== id; });
  renderRequests();
  await saveRequestsToCloud();
}

async function saveRequestsToCloud(){
  try{
    var realRequests = songRequests.filter(function(r){ return r.id !== 'test-bogo'; });
    await fetch(`${PROXY_BASE}/song-requests-log`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ requests: realRequests })
    });
  }catch(e){}
}

async function clearAllRequests(){
  if(!confirm('Clear all requests from the list?')) return;
  songRequests = [];
  testBogoDismissed = true;
  renderRequests();
  await saveRequestsToCloud();
}

loadRequests();
setInterval(loadRequests, 5000);
</script>
</body>
</html>
