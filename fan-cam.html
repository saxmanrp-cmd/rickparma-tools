<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fan Cam — Send it to Rick</title>

<!--
  ============================================================
  SETUP — fill these in before publishing. None of this needs
  a server; every value below is safe to expose in client code
  as long as you configure the matching preset/template as
  UNSIGNED / public-safe on each service's dashboard.

  1) CLOUDINARY (stores the photo/video, gives back a link)
     - Sign up free at cloudinary.com
     - Settings → Upload → Add upload preset → set "Signing Mode"
       to "Unsigned". Copy the preset name and your cloud name.

  2) JSONBIN (keeps the running list of submissions for your
     gallery viewer — same pattern as your Photo Gallery Manager)
     - Create a bin at jsonbin.io containing: []
     - Copy the Bin ID and your X-Master-Key.

  3) EMAILJS (sends you the instant alert — no backend needed)
     - Sign up free at emailjs.com, connect your email account
       as a Service.
     - Create a Template with a "To Email" field set to the
       variable {{to_email}}, and body using {{name}} and
       {{media_url}}.
     - Copy your Public Key, Service ID, and Template ID.

  4) YOUR PHONE'S EMAIL-TO-TEXT ADDRESS (the "instant text" half)
     Most US carriers turn an email into a text message:
       AT&T:      yournumber@txt.att.net
       Verizon:   yournumber@vtext.com
       T-Mobile:  yournumber@tmomail.net
     Search "[your carrier] email to text" if yours isn't listed.
  ============================================================
-->
<script>
  const CONFIG = {
    cloudName: "ffgvgf5j",
    uploadPreset: "e7siodn3",
    jsonbinId: "6a668bb8f5f4af5e29c51472",
    jsonbinKey: "$2a$10$AE8jTzF3OJJNfqTgYPcPK.SzVAdv0Mqi/obwqWTuQjpE0dOkYkCE.",
    emailjsPublicKey: "SEWLi2Tr98RNT5x5-",
    emailjsServiceId: "service_aqee1fo",
    emailjsTemplateId: "template_c4vxf9t",
    notifyEmail: "saxman@rickparma.com",
    notifySmsGateway: "7732091124@vtext.com",
    maxVideoSeconds: 20
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=Lato:wght@400;700&display=swap');

  :root{
    --bg:#130101;
    --panel:#1c0606;
    --accent:#8DB2E5;
    --white:#F5F0EA;
    --paper:#EDE7DC;
    --ink:#2b2320;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);
    font-family:'Lato',sans-serif; -webkit-tap-highlight-color:transparent;}
  body{min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:20px 16px 40px;}

  h1{font-family:'Josefin Sans',sans-serif; font-weight:700; letter-spacing:.04em;
    font-size:1.5rem; margin:4px 0 2px; text-align:center;}
  .sub{font-size:.92rem; color:var(--accent); text-align:center; margin:0 0 20px;
    font-family:'Josefin Sans',sans-serif; letter-spacing:.03em;}

  /* ---- stage-view frame: the camera lives inside a spotlight ---- */
  .stage{
    position:relative; width:100%; max-width:420px; aspect-ratio:3/4;
    border-radius:18px; overflow:hidden; background:#000;
    box-shadow:0 0 0 1px rgba(141,178,229,.25), 0 30px 60px -20px rgba(0,0,0,.7);
  }
  .stage::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at 50% 38%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);
  }
  video, .shot-preview{width:100%; height:100%; object-fit:cover; display:block;}
  .rec-ring{
    position:absolute; top:14px; left:14px; z-index:3; display:none;
    align-items:center; gap:6px; background:rgba(19,1,1,.55); backdrop-filter:blur(3px);
    padding:5px 10px 5px 8px; border-radius:20px; font-size:.78rem;
    font-family:'Josefin Sans',sans-serif; letter-spacing:.03em;
  }
  .rec-dot{width:9px; height:9px; border-radius:50%; background:#e5527a;
    animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .controls{display:flex; align-items:center; justify-content:center; gap:26px;
    margin-top:22px; width:100%; max-width:420px;}
  .flip-btn, .mode-btn{
    background:transparent; border:1px solid rgba(141,178,229,.5); color:var(--accent);
    width:46px; height:46px; border-radius:50%; font-size:1.1rem; cursor:pointer;
  }
  .shutter{
    width:78px; height:78px; border-radius:50%; border:4px solid var(--white);
    background:var(--accent); cursor:pointer; position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  .shutter.video-armed{background:#e5527a;}
  .shutter:active{transform:scale(.94);}
  .mode-row{display:flex; gap:10px; margin-top:14px; font-family:'Josefin Sans',sans-serif;}
  .mode-row button{
    background:none; border:none; color:var(--white); opacity:.55; font-size:.9rem;
    letter-spacing:.04em; padding:6px 10px; cursor:pointer; border-bottom:2px solid transparent;
  }
  .mode-row button.active{opacity:1; border-color:var(--accent); color:var(--accent);}

  .hint{font-size:.82rem; color:#c9b8b8; margin-top:14px; text-align:center; max-width:340px;}

  /* ---- polaroid review card ---- */
  .polaroid-wrap{display:none; width:100%; max-width:340px; margin-top:10px;}
  .polaroid{
    background:var(--paper); border-radius:4px; padding:14px 14px 46px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.6);
    transform:translateY(40px) rotate(-2deg); opacity:0;
    animation:eject .55s cubic-bezier(.2,.8,.3,1.1) forwards;
  }
  @keyframes eject{to{transform:translateY(0) rotate(-1.2deg); opacity:1;}}
  .polaroid img, .polaroid video{width:100%; display:block; border-radius:2px; background:#000;}
  .polaroid .caption{
    font-family:'Josefin Sans',sans-serif; color:var(--ink); text-align:center;
    margin-top:10px; font-size:.95rem; letter-spacing:.02em;
  }
  input[type=text]{
    width:100%; margin-top:12px; padding:10px 12px; font-size:16px; border-radius:8px;
    border:1px solid rgba(141,178,229,.4); background:var(--panel); color:var(--white);
    font-family:'Lato',sans-serif;
  }
  input[type=text]::placeholder{color:#a99;}

  .review-actions{display:flex; gap:10px; margin-top:14px; width:100%; max-width:340px;}
  .btn{flex:1; padding:13px 10px; border-radius:10px; border:none; font-size:16px;
    font-family:'Josefin Sans',sans-serif; font-weight:600; letter-spacing:.02em; cursor:pointer;}
  .btn.primary{background:var(--accent); color:#0d1420;}
  .btn.ghost{background:transparent; color:var(--white); border:1px solid rgba(245,240,234,.35);}
  .btn:disabled{opacity:.5;}

  .status{margin-top:16px; font-family:'Josefin Sans',sans-serif; letter-spacing:.02em;
    text-align:center; min-height:1.4em;}
  .status.success{color:#7fd8a3;}
  .status.error{color:#e5527a;}

  .denied{max-width:340px; text-align:center; margin-top:40px; line-height:1.5;}
</style>
</head>
<body>

  <h1>📸 Fan Cam</h1>
  <p class="sub">Got a shot of the show? Send it straight to Rick.</p>

  <div class="stage" id="stage">
    <video id="preview" autoplay playsinline muted></video>
    <div class="rec-ring" id="recRing"><span class="rec-dot"></span><span id="recTime">0:00</span></div>
  </div>

  <div class="controls">
    <button class="flip-btn" id="flipBtn" aria-label="Switch camera">⟲</button>
    <button class="shutter" id="shutterBtn" aria-label="Capture"></button>
    <div style="width:46px;"></div>
  </div>

  <div class="mode-row">
    <button id="photoModeBtn" class="active">PHOTO</button>
    <button id="videoModeBtn">VIDEO</button>
  </div>

  <p class="hint">Tap once for a photo. In video mode, tap to start and tap again to stop (max <span id="maxSecLabel"></span>s).</p>

  <div class="polaroid-wrap" id="polaroidWrap">
    <div class="polaroid">
      <div id="polaroidMedia"></div>
      <div class="caption">for Rick 🎷</div>
    </div>
    <input type="text" id="nameInput" placeholder="Your name (optional)">
    <div class="review-actions">
      <button class="btn ghost" id="retakeBtn">Retake</button>
      <button class="btn primary" id="sendBtn">Send to Rick</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="denied" id="deniedMsg" style="display:none;">
    Rick's Fan Cam needs camera access to work. Check your browser's site
    settings and allow the camera, then reload this page.
  </div>

<script>
document.getElementById('maxSecLabel').textContent = CONFIG.maxVideoSeconds;

let stream = null;
let facingMode = 'environment';
let mode = 'photo'; // 'photo' | 'video'
let mediaRecorder = null;
let recordedChunks = [];
let recording = false;
let recTimerInterval = null;
let recSeconds = 0;
let capturedBlob = null; // final blob to upload
let capturedKind = null; // 'image' | 'video'

const videoEl = document.getElementById('preview');
const shutterBtn = document.getElementById('shutterBtn');
const flipBtn = document.getElementById('flipBtn');
const photoModeBtn = document.getElementById('photoModeBtn');
const videoModeBtn = document.getElementById('videoModeBtn');
const recRing = document.getElementById('recRing');
const recTime = document.getElementById('recTime');
const polaroidWrap = document.getElementById('polaroidWrap');
const polaroidMedia = document.getElementById('polaroidMedia');
const stageEl = document.getElementById('stage');
const statusEl = document.getElementById('status');
const nameInput = document.getElementById('nameInput');

async function startCamera(){
  stopCamera();
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode, width:{ideal:1080}, height:{ideal:1440} },
      audio: mode === 'video'
    });
    videoEl.srcObject = stream;
    document.getElementById('deniedMsg').style.display = 'none';
    stageEl.style.display = '';
  }catch(err){
    document.getElementById('deniedMsg').style.display = 'block';
    stageEl.style.display = 'none';
    document.querySelector('.controls').style.display = 'none';
    document.querySelector('.mode-row').style.display = 'none';
  }
}
function stopCamera(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
}

flipBtn.addEventListener('click', ()=>{
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

photoModeBtn.addEventListener('click', ()=> setMode('photo'));
videoModeBtn.addEventListener('click', ()=> setMode('video'));
function setMode(m){
  mode = m;
  photoModeBtn.classList.toggle('active', m==='photo');
  videoModeBtn.classList.toggle('active', m==='video');
  shutterBtn.classList.toggle('video-armed', m==='video');
  startCamera();
}

shutterBtn.addEventListener('click', ()=>{
  if(mode === 'photo') takePhoto();
  else recording ? stopRecording() : startRecording();
});

function takePhoto(){
  const canvas = document.createElement('canvas');
  canvas.width = videoEl.videoWidth;
  canvas.height = videoEl.videoHeight;
  const ctx = canvas.getContext('2d');
  if(facingMode === 'user'){ ctx.translate(canvas.width,0); ctx.scale(-1,1); }
  ctx.drawImage(videoEl, 0, 0);
  canvas.toBlob(blob=>{
    capturedBlob = blob;
    capturedKind = 'image';
    showPolaroid(URL.createObjectURL(blob), 'image');
  }, 'image/jpeg', 0.92);
}

function pickMimeType(){
  const candidates = ['video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}

function startRecording(){
  recordedChunks = [];
  const mimeType = pickMimeType();
  mediaRecorder = new MediaRecorder(stream, mimeType ? {mimeType} : undefined);
  mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = ()=>{
    const blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || 'video/webm'});
    capturedBlob = blob;
    capturedKind = 'video';
    showPolaroid(URL.createObjectURL(blob), 'video');
  };
  mediaRecorder.start();
  recording = true;
  recSeconds = 0;
  recRing.style.display = 'flex';
  recTime.textContent = '0:00';
  recTimerInterval = setInterval(()=>{
    recSeconds++;
    const m = Math.floor(recSeconds/60), s = recSeconds%60;
    recTime.textContent = m+':'+String(s).padStart(2,'0');
    if(recSeconds >= CONFIG.maxVideoSeconds) stopRecording();
  }, 1000);
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  recording = false;
  clearInterval(recTimerInterval);
  recRing.style.display = 'none';
}

function showPolaroid(url, kind){
  stopCamera();
  document.querySelector('.controls').style.display = 'none';
  document.querySelector('.mode-row').style.display = 'none';
  document.querySelector('.hint').style.display = 'none';
  stageEl.style.display = 'none';
  polaroidMedia.innerHTML = kind === 'image'
    ? `<img src="${url}" alt="your capture">`
    : `<video src="${url}" controls playsinline></video>`;
  polaroidWrap.style.display = 'block';
  statusEl.textContent = '';
  statusEl.className = 'status';
}

document.getElementById('retakeBtn').addEventListener('click', ()=>{
  capturedBlob = null; capturedKind = null;
  polaroidWrap.style.display = 'none';
  stageEl.style.display = '';
  document.querySelector('.controls').style.display = 'flex';
  document.querySelector('.mode-row').style.display = 'flex';
  document.querySelector('.hint').style.display = 'block';
  nameInput.value = '';
  startCamera();
});

document.getElementById('sendBtn').addEventListener('click', sendToRick);

async function sendToRick(){
  if(!capturedBlob) return;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  document.getElementById('retakeBtn').disabled = true;
  statusEl.className = 'status';
  statusEl.textContent = 'Sending…';

  try{
    const mediaUrl = await uploadToCloudinary(capturedBlob, capturedKind);
    const name = nameInput.value.trim() || 'A fan';
    const timestamp = new Date().toISOString();

    await Promise.allSettled([
      logToJsonbin({ name, mediaUrl, kind: capturedKind, timestamp }),
      notifyRick(name, mediaUrl)
    ]);

    statusEl.className = 'status success';
    statusEl.textContent = 'Rick got it — thank you! 🎷';
    setTimeout(()=>{
      polaroidWrap.style.display = 'none';
      capturedBlob = null; capturedKind = null;
      document.querySelector('.controls').style.display = 'flex';
      document.querySelector('.mode-row').style.display = 'flex';
      document.querySelector('.hint').style.display = 'block';
      stageEl.style.display = '';
      nameInput.value = '';
      sendBtn.disabled = false;
      document.getElementById('retakeBtn').disabled = false;
      startCamera();
    }, 2200);
  }catch(err){
    console.error(err);
    statusEl.className = 'status error';
    statusEl.textContent = "Couldn't send that — check your connection and try again.";
    sendBtn.disabled = false;
    document.getElementById('retakeBtn').disabled = false;
  }
}

async function uploadToCloudinary(blob, kind){
  const form = new FormData();
  const ext = kind === 'image' ? 'jpg' : (blob.type.includes('mp4') ? 'mp4' : 'webm');
  form.append('file', blob, `fancam-${Date.now()}.${ext}`);
  form.append('upload_preset', CONFIG.uploadPreset);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudName}/auto/upload`, {
    method: 'POST', body: form
  });
  if(!res.ok) throw new Error('Cloudinary upload failed');
  const data = await res.json();
  return data.secure_url;
}

async function logToJsonbin(entry){
  const base = `https://api.jsonbin.io/v3/b/${CONFIG.jsonbinId}`;
  const headers = { 'Content-Type': 'application/json', 'X-Master-Key': CONFIG.jsonbinKey };
  const current = await fetch(base + '/latest', { headers }).then(r=>r.json());
  const list = Array.isArray(current.record) ? current.record : [];
  list.unshift(entry);
  await fetch(base, { method:'PUT', headers, body: JSON.stringify(list) });
}

function notifyRick(name, mediaUrl){
  if(!window.emailjs || CONFIG.emailjsPublicKey.startsWith('YOUR_')) return Promise.resolve();
  emailjs.init({ publicKey: CONFIG.emailjsPublicKey });
  const baseParams = { name, media_url: mediaUrl };
  return Promise.allSettled([
    emailjs.send(CONFIG.emailjsServiceId, CONFIG.emailjsTemplateId,
      { ...baseParams, to_email: CONFIG.notifyEmail }),
    emailjs.send(CONFIG.emailjsServiceId, CONFIG.emailjsTemplateId,
      { ...baseParams, to_email: CONFIG.notifySmsGateway })
  ]);
}

startCamera();
</script>
</body>
</html>
